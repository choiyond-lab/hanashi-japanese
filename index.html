const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let RP=null;
const rand=a=>a[Math.random()*a.length|0];
// 정답 공개 때 "이렇게도 말해요" 목록
function altListHTML(ln){
  const others=(ln.versions||[]).filter(v=>altKey(v.line)!==altKey(ln.line));
  if(!others.length)return '';
  return `<div class="alt-say"><b>이렇게도 말해요</b>${others.map(v=>`<div><span class="jp">${v.line.ruby}</span><span class="ko">${esc(v.ko)}</span></div>`).join('')}</div>`;
}
/* 랜덤 회화: 장면·대화·표현을 모두 무작위로
   범위: 배운 장면(하나라도 학습한 레슨) 또는 전체 */
function randomScenePool(){
  const all=LESSONS.filter(L=>L.lines.length);
  const learnedScenes=all.filter(L=>lessonProgress(L).intro>0);
  return DB.settings.randomScope==='all'||!learnedScenes.length?all:learnedScenes;
}
function openRandomRoleplay(mode){
  const pool=randomScenePool(),last=RP?.L?.id||DB.settings.lastScene;
  const cand=pool.length>1?pool.filter(L=>L.id!==last):pool;
  const L=rand(cand),v=Math.random()*L.variants.length|0;
  if(RP){playToken++;activeRecognition?.abort();stopSpeech();RP=null}
  openRoleplay(L.id,mode||(DB.settings.practiceMode==='full'?'full':'quick'),v,{random:true});
}
function roleplayLimit(L,mode='quick'){
  const n=L.lines.filter(x=>x.role==='M').length;
  return mode==='full'?n:Math.min(3,n);
}
function openRoleplay(id,mode='quick',vIndex,opts={}){
  const base=LESSON_BY_ID[id];if(!base?.lines.length)return;
  // 같은 장면이라도 할 때마다 다른 대화로 돌아가며 연습
  const vs=base.variants,next=DB.rpNext||(DB.rpNext={});
  const v=Number.isInteger(vIndex)?vIndex:(next[id]||0)%vs.length;
  next[id]=v+1;
  // 같은 맥락이라도 사람마다 다르게 말해요: 대사마다 바꿔 말하기 중 하나를 무작위로 골라 진행
  const lines=vs[v].lines.map(l=>{const p=rand(l.versions);return {...l,line:p.line,ko:p.ko,raw:p.raw}});
  const L={...base,roles:vs[v].roles,lines,dialog:vs[v].raw,vTitle:vs[v].title,vCount:vs.length,vIndex:v};
  stopPlay();
  RP={L,mode,i:0,score:0,mine:0,total:roleplayLimit(L,mode),tok:playToken,busy:true,ended:false,weak:[],tries:0,random:!!opts.random};
  DB.onboarded=true;DB.settings.lastScene=id;save();
  $('#rpTitle').textContent=`${opts.random?'🎲 ':''}${L.icon} ${L.title}${L.vCount>1?` · ${L.vTitle} (${v+1}/${L.vCount})`:''}`;
  $('#rpChat').innerHTML=`<div class="tip" style="font-size:13px"><b>${esc(L.scene)}</b><br>${mode==='full'?'전체 대화':'약 3분 · 내 차례 최대 3번'}로 연습해요. 상대 대사와 답변 예문은 미리 준비되어 있어요. 보기·직접 입력·말하기 중 편한 방법을 골라요.</div>`;
  $('#rp').classList.add('open');$('#rpScroll').scrollTop=0;rpStep();
}
function rpProgress(){
  const s=RP;if(!s)return;
  return `<div class="rp-progress"><span>${s.mode==='full'?'전체 대화':'3분 연습'}</span><b>${s.mine}/${s.total}문장 완료</b></div><div class="bar" style="margin:6px 0 14px"><i style="width:${s.mine/s.total*100}%"></i></div>`;
}
function rpBubble(ln,me){
  const d=document.createElement('div');d.className='msg '+(me?'me':'');
  d.innerHTML=`<div class="who">${me?'나 · 예문':esc(RP.L.roles[ln.role])}</div><div class="bubble">${jpHTML(ln.line)}${pronHTML(ln.line)}<div class="ko">${esc(ln.ko)}</div></div>`;
  d.querySelector('.bubble').onclick=()=>speak(sayLine(ln.line));
  $('#rpChat').appendChild(d);$('#rpScroll').scrollTo({top:1e6,behavior:'smooth'});return d;
}
async function rpStep(){
  const s=RP;if(!s||s.ended)return;s.busy=true;
  $('#rpInner').innerHTML=rpProgress();
  if(s.mine>=s.total&&s.mode!=='full')return rpEnd();
  while(RP===s&&s.i<s.L.lines.length&&s.L.lines[s.i].role!=='M'){
    const ln=s.L.lines[s.i];rpBubble(ln,false);
    if(DB.settings.autoplay)await speak(sayLine(ln.line));
    if(RP!==s)return;s.i++;
  }
  if(RP!==s)return;
  if(s.i>=s.L.lines.length)return rpEnd();
  s.busy=false;rpMyTurn();
}
function rpRemember(s){
  const ln=s.L.lines[s.i];if(!ln||ln.role!=='M')return;
  if(!s.weak.some(x=>x.line.surf===ln.line.surf))s.weak.push(ln);
  let it=BY_ID['p:'+ln.line.surf]||BY_ID['w:'+ln.line.surf]||BY_ID['a:'+ln.line.surf];
  if(!it){const rec={jp:ln.raw||s.L.dialog[s.i][1],ko:ln.ko,note:'내장 회화에서 다시 연습할 예문',scene:s.L.title,at:Date.now()};DB.custom.push(rec);it=registerCustom(rec)}
  if(!DB.practiceNotes.includes(it.id))DB.practiceNotes.push(it.id);
  const card=DB.cards[it.id];
  if(!card)DB.cards[it.id]={s:'learn',step:0,due:Date.now(),ivl:0,ease:2.5,reps:0,lapses:0,intro:Date.now(),last:0,ok:0,ng:0};
  else card.due=Math.min(card.due,Date.now());
  save();return it;
}
function rpMyTurn(){
  const s=RP,ln=s.L.lines[s.i];s.tries=0;
  $('#rpInner').innerHTML=`${rpProgress()}<div class="rp-say">내 차례 ${s.mine+1} · 이 뜻으로 말해 보세요</div><div class="rp-ko">${esc(ln.ko)}</div>
    <div class="rp-actions"><button class="btn btn-primary" id="rpChoose">보기에서 고르기</button><button class="btn btn-ghost" id="rpType">직접 입력</button>${SR&&DB.settings.speaking?'<button class="btn btn-ghost" id="rpMic">🎤 말하기</button>':''}<button class="btn btn-line" id="rpShow">예문 보기</button></div>
    <div id="rpOpts" class="rp-opts"></div><div id="rpAnswer"></div><div class="heard" id="rpHeard" role="status" style="margin-top:8px"></div>`;
  $('#rpChoose').onclick=()=>rpChoices(s);
  $('#rpType').onclick=()=>{
    if(RP!==s||s.busy)return;
    $('#rpOpts').innerHTML='';
    $('#rpAnswer').innerHTML='<form id="rpForm" class="rp-type"><label for="rpInput">일본어로 써 보세요</label><input id="rpInput" lang="ja" autocomplete="off" placeholder="일본어 답변" maxlength="180"><button class="btn btn-primary" type="submit">예문과 비교</button><p class="fine">글자 유사도를 비교해요. 뜻이나 문법을 판단하지 않으며, 다른 표현도 맞을 수 있어요.</p></form>';
    $('#rpForm').onsubmit=e=>{e.preventDefault();const value=$('#rpInput').value.trim();if(!value){toast('일본어로 답변을 입력해 주세요');return}rpCompare(s,[value])};
    $('#rpInput').focus();
  };
  $('#rpShow').onclick=()=>{if(RP!==s||s.busy)return;rpRemember(s);rpReveal(s,'예문을 읽고 소리 내어 따라 해 보세요.',false)};
  if($('#rpMic'))$('#rpMic').onclick=async()=>{
    if(RP!==s||s.busy)return;s.busy=true;rpDisable(true);$('#rpHeard').textContent='듣는 중… 일본어로 말해 주세요.';
    try{const alts=await recognize();if(RP!==s)return;s.busy=false;rpDisable(false);if(alts.length)rpCompare(s,alts);else $('#rpHeard').textContent='소리를 듣지 못했어요. 직접 입력하거나 보기에서 골라요.'}
    catch(e){if(RP!==s)return;s.busy=false;rpDisable(false);$('#rpHeard').textContent='음성 인식을 사용할 수 없어요. 직접 입력하거나 보기에서 골라요.'}
  };
}
function rpDisable(disabled){document.querySelectorAll('#rpInner button,#rpInner input').forEach(b=>b.disabled=disabled)}
function rpChoices(s){
  if(RP!==s||s.busy)return;const ln=s.L.lines[s.i];$('#rpAnswer').innerHTML='';$('#rpHeard').textContent='';
  // 오답 보기: 같은 단계의 다른 장면에서 길이가 비슷한 내 대사 → 뜻을 이해해야 고를 수 있게
  const same=new Set((ln.versions||[ln]).map(v=>altKey(v.line)));
  const mLines=ls=>[...new Map(ls.flatMap(L=>(L.allLines||[]).filter(x=>x.role==='M'&&!same.has(altKey(x.line)))).map(x=>[x.line.surf,x])).values()];
  let unique=mLines(LESSONS.filter(L=>L.course===s.L.course&&L.id!==s.L.id));
  if(unique.length<6)unique=mLines(LESSONS.filter(L=>L.id!==s.L.id));
  const nearby=shuffle(unique).sort((a,b)=>Math.abs(a.line.bare.length-ln.line.bare.length)-Math.abs(b.line.bare.length-ln.line.bare.length)).slice(0,6);
  const opts=shuffle([ln,...shuffle(nearby).slice(0,2)]);
  // 보기마다 오른쪽에 소리 듣기 버튼: 듣고 고를 수 있게 (누르기만 해서는 답으로 처리되지 않음)
  $('#rpOpts').innerHTML=opts.map((o,i)=>`<div class="opt-row"><button class="opt jp-opt" data-choice="${i}"><span class="opt-text">${o.line.ruby}</span></button><button class="opt-say" data-say-opt="${i}" aria-label="${i+1}번 보기 듣기">🔊</button></div>`).join('');
  document.querySelectorAll('#rpOpts [data-say-opt]').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(sayLine(opts[+b.dataset.sayOpt].line))});
  document.querySelectorAll('#rpOpts [data-choice]').forEach(b=>b.onclick=()=>{
    if(RP!==s||s.busy||b.disabled)return;
    if(opts[+b.dataset.choice]===ln){b.classList.add('correct');rpDone(s.tries===0)}
    else{s.tries++;rpRemember(s);b.classList.add('wrong');b.disabled=true;$('#rpHeard').textContent='이 뜻에 맞는 예문을 한 번 더 골라 보세요.'}
  });
}
function rpCompare(s,alts){
  if(RP!==s||s.busy)return;const cur=s.L.lines[s.i],best=(cur.versions||[cur]).map(v=>({v,sc:speechScore(alts,v.line)})).sort((a,b)=>b.sc-a.sc)[0];
  const score=best.sc,good=score>=.8&&s.tries===0;s.matched=best.v;
  s.tries++;if(!good)rpRemember(s);
  rpReveal(s,`입력: ${alts[0]} · 예문과 ${Math.round(score*100)}% 일치`,good);
}
function rpReveal(s,message,good){
  if(RP!==s||s.busy)return;s.busy=true;rpDisable(true);const ln=s.L.lines[s.i];
  $('#rpAnswer').innerHTML=`<div class="rp-compare"><p>${esc(message)}</p><b>준비된 예문</b><div class="jp">${ln.line.ruby}</div>${pronHTML(ln.line)}${altListHTML(ln)}<p class="fine">글자 비교 결과이며 AI 문법 채점은 아니에요. 다른 자연스러운 답변도 있을 수 있어요.</p><div class="rp-actions"><button class="btn btn-primary" id="rpNext">다음 대사</button><button class="btn btn-ghost" id="rpListen">🔊 예문 듣기</button></div></div>`;
  let moved=false;
  $('#rpNext').onclick=()=>{if(moved||RP!==s||!s.busy)return;moved=true;s.busy=false;rpDone(good)};
  $('#rpListen').onclick=()=>speak(sayLine(ln.line));
}
async function rpDone(good){
  const s=RP;if(!s||s.busy||s.ended)return;s.busy=true;rpDisable(true);
  const ln=s.L.lines[s.i];if(good)s.score++;else rpRemember(s);
  s.mine++;const t=today();t.n++;if(good)t.ok++;save();
  $('#rpInner').innerHTML=rpProgress();rpBubble(ln,true);
  if(DB.settings.autoplay)await speak(sayLine(ln.line));
  if(RP!==s)return;s.i++;rpStep();
}
function rpEnd(){
  const s=RP;if(!s||s.ended)return;s.ended=true;s.busy=true;
  $('#rpInner').innerHTML=`${rpProgress()}<div style="text-align:center"><div style="font-size:36px">🎉</div><b style="font-size:17px">${s.mode==='full'?'상황 대화':'짬짬이 연습'} 완료!</b><p style="color:var(--ink2);font-size:13px;margin:5px 0 12px">${s.mine}문장 연습 · 첫 시도에 예문과 맞춘 문장 ${s.score}개<br>${s.weak.length?`막힌 표현 ${s.weak.length}개를 복습에 담았어요.`:'꾸준히 반복하면 더 편하게 말할 수 있어요.'}</p>
    <div class="rp-actions"><button class="btn ${s.random?'btn-primary':'btn-ghost'}" id="rpRandom">🎲 다음 랜덤 회화</button>${s.weak.length?`<button class="btn ${s.random?'btn-ghost':'btn-primary'}" id="rpReview">막힌 표현 복습</button>`:''}<button class="btn btn-ghost" id="rpAgain">${s.L.vCount>1?'같은 장면 다른 대화':'다시 연습'}</button><button class="btn btn-line" id="rpExit">닫기</button></div></div>`;
  $('#rpRandom').onclick=()=>openRandomRoleplay(s.mode);
  if($('#rpReview'))$('#rpReview').onclick=()=>{
    const items=s.weak.map(ln=>BY_ID['p:'+ln.line.surf]||BY_ID['w:'+ln.line.surf]||BY_ID['a:'+ln.line.surf]).filter(Boolean);
    closeRoleplay();startSession({practice:items.map(item=>({item,t:'ex',type:item.line.toks.length>=3?'build':'recall'})),title:'막힌 표현 복습'});
  };
  $('#rpAgain').onclick=()=>openRoleplay(s.L.id,s.mode);$('#rpExit').onclick=closeRoleplay;
}
function closeRoleplay(){playToken++;activeRecognition?.abort();stopSpeech();RP=null;$('#rp').classList.remove('open');if(LS&&$('#ls').classList.contains('open'))drawLesson();render()}
$('#rpClose').onclick=closeRoleplay;

    <p class="fine">자유롭게 답을 만드는 AI 대화가 아닌 내장 예문 연습이에요. 음성 기능은 기기·브라우저에 따라 인터넷이 필요하거나 지원되지 않을 수 있어요.</p>
    <div class="sec-h"><h2>🎲 랜덤 회화</h2><span>장면·대화·표현을 무작위로</span></div>
    <button class="scene-btn random-btn" id="rpRandomGo"><div class="lesson-ico">🎲</div><div class="t"><b>랜덤 회화 시작</b><small>${randomScenePool().length}개 장면 · 대화 ${randomScenePool().reduce((n,L)=>n+L.variants.length,0)}개 중에서 무작위로 · 상대가 매번 다르게 말해요</small></div><span>›</span></button>
    <div class="seg"><button data-rscope="learned" class="${DB.settings.randomScope!=='all'?'on':''}">배운 장면에서</button><button data-rscope="all" class="${DB.settings.randomScope==='all'?'on':''}">전체 장면에서</button></div>
    <div class="sec-h"><h2>${DB.settings.lastScene?'최근 연습한 장면':'바로 시작하기'}</h2><span>가볍게 한 장면</span></div>${card(recent)}
    <div class="sec-h"><h2>상황 고르기</h2><span>${scenes.length}개 장면</span></div><div class="scene-list">${scenes.map(card).join('')}</div>
    <div class="sec-h"><h2>다시 말해 볼 표현</h2><span>매일 복습에 포함</span></div><button class="scene-btn" id="noteOpen"><div class="lesson-ico">📝</div><div class="t"><b>회화 노트 ${new Set([...DB.practiceNotes,...AI_LESSON.items.map(x=>x.id)]).size}개</b><small>예문을 확인했거나 막혔던 표현</small></div><span>›</span></button>`;
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{DB.settings.practiceMode=b.dataset.mode;save();render()});
  document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>openRoleplay(b.dataset.scene,mode));
  $('#rpRandomGo').onclick=()=>openRandomRoleplay(mode);
  document.querySelectorAll('[data-rscope]').forEach(b=>b.onclick=()=>{DB.settings.randomScope=b.dataset.rscope;save();render()});
  $('#noteOpen').onclick=()=>{bookKind='ai';bookB='all';bookQ='';setTab('book')};
}
/* ============================================================
   14. 키보드 · 시작
   ============================================================ */
document.addEventListener('keydown',e=>{
  if(!$('#sx').classList.contains('open'))return;
  if(e.target.tagName==='INPUT')return;
  if($('#fb').classList.contains('show')){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#fbNext')?.click()}
    const g={'1':'again','2':'hard','3':'good','4':'easy'}[e.key];
    if(g)document.querySelector(`#fbInner [data-g="${g}"]`)?.click();
    return;
  }
  const n=+e.key;
  if(n>=1&&n<=4){const o=document.querySelectorAll('#sxBody .opt')[n-1];if(o&&!o.disabled){o.click();return}}
  if(e.key==='Enter'&&$('#sxFoot').style.display!=='none'&&!$('#sxPrimary').disabled){e.preventDefault();$('#sxPrimary').click()}
});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
applyTheme();
setTab('home');
</script>
<script>(() => {
  const localFile = location.protocol === 'file:' || location.protocol === 'content:' || !!document.querySelector('meta[name="hanashi-portable"]');
  const standalone = matchMedia('(display-mode: standalone)').matches;
  const card = document.createElement('aside');
  card.className = 'mobile-card';
  card.setAttribute('aria-label', '휴대폰 설치 및 오프라인 안내');
  card.innerHTML = `<div class="mobile-row"><div><strong>하루 3분, 주머니 속 일본어</strong><span class="mobile-status" id="mobileStatus" role="status">오프라인 준비 상태 확인 중…</span></div><button class="mobile-install" id="mobileInstall">휴대폰에 설치</button></div>
    <details id="mobileHelp"><summary>설치 · 오프라인 이용 안내</summary>
    <p>안드로이드 <b>Chrome</b>에서 이 주소를 열고 <b>⋮ → 홈 화면에 추가 → 설치</b>를 선택하세요. 메뉴 이름은 버전에 따라 다를 수 있어요.</p>
    <p><b>오프라인 학습 준비 완료</b>가 뜬 뒤에는 내장 회화·단어·복습을 인터넷 없이 이용할 수 있어요. 음성 재생은 기기의 일본어 음성에 따라 달라지고, 음성 인식은 인터넷이 필요할 수 있어요. 선택지와 직접 입력은 항상 사용할 수 있어요.</p>
    <p>자유롭게 답을 생성하는 AI는 포함하지 않아요. 내장 대본의 예문과 비교하며 연습하고, API 키나 AI 사용료는 필요 없어요. 기록은 이 기기의 브라우저에 저장돼요. 기존 파일에서 쌓은 기록은 <b>기록 → 설정 → 학습 기록 백업하기/백업 불러오기</b>로 옮겨 주세요.</p>
    <button class="mobile-install mobile-copy" id="mobileCopy">설치 주소 복사</button><span class="mobile-status" id="mobileCopyStatus" role="status"></span></details>
    <button class="mobile-install mobile-update" id="mobileUpdate">새 버전 준비됨 · 학습을 마친 뒤 적용</button>`;
  document.querySelector('#view')?.before(card);
  if (localFile) {
    card.querySelector('#mobileHelp').innerHTML = `<summary>파일 이용 · 기록 저장 안내</summary><p>이 파일 하나만 휴대폰에 옮기면 돼요. <b>내 파일 → 다운로드 → HTML 파일</b>을 누르고, 앱 선택이 나오면 Chrome 같은 웹 브라우저로 열어 주세요. 메신저 미리보기나 일부 HTML 뷰어에서는 버튼이 동작하지 않을 수 있어요.</p><p>단어·예문·선택지·복습은 인터넷 없이 사용할 수 있어요. 음성 재생은 기기의 일본어 음성 지원에 따라 달라지고, 음성 인식은 인터넷이 필요할 수 있어요.</p><p>파일을 연 브라우저와 파일 위치를 유지하면 기록을 이어가기 쉬워요. 파일을 옮기거나 삭제하기 전에는 <b>기록 → 설정 → 학습 기록 백업하기</b>로 기록을 보관하세요. 자유대화 AI가 아닌 내장 예문 연습으로, API 키와 AI 사용료는 필요 없어요.</p><button id="mobileCopy" hidden></button><span id="mobileCopyStatus" class="mobile-status" role="status"></span>`;
  } else {
    const download = document.createElement('a');
    download.href = './hanashi-offline.html';
    download.download = '하나시 일본어-휴대폰용.html';
    download.textContent = '휴대폰용 HTML 파일 내려받기';
    download.className = 'mobile-status';
    card.querySelector('#mobileHelp').append(download);
  }
  const status = card.querySelector('#mobileStatus');
  const install = card.querySelector('#mobileInstall');
  const copy = card.querySelector('#mobileCopy');
  const copyStatus = card.querySelector('#mobileCopyStatus');
  let offlineReady = false;
  let installPrompt = null;
  let registration = null;
  function showStatus() {
    status.textContent = localFile ? '파일 버전 · 내장 학습은 인터넷 없이 이용 가능' :
      offlineReady ? (navigator.onLine ? '오프라인 학습 준비 완료 · API 키 없음' : '오프라인 · 내장 학습 이용 가능') :
      (navigator.onLine ? '오프라인 저장 준비 중…' : '오프라인 저장이 아직 완료되지 않았어요');
  }
  showStatus();
  try {
    const probe = 'hanashi.storage.check';
    localStorage.setItem(probe, '1'); localStorage.removeItem(probe);
  } catch {
    const warning = document.createElement('p');
    warning.setAttribute('role','status');
    warning.textContent = '현재 파일을 연 앱은 학습 기록 저장을 지원하지 않아요. 학습 후 기록 메뉴에서 백업을 내려받아 주세요.';
    card.append(warning);
  }
  if (standalone) install.hidden = true;
  if (localFile) { install.hidden = true; copy.hidden = true; }
  window.addEventListener('online', showStatus);
  window.addEventListener('offline', showStatus);
  window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); installPrompt = event; install.hidden = false; });
  window.addEventListener('appinstalled', () => { install.hidden = true; installPrompt = null; });
  install.addEventListener('click', async () => {
    if (!installPrompt) { card.querySelector('#mobileHelp').open = true; return; }
    try { await installPrompt.prompt(); await installPrompt.userChoice; } catch { card.querySelector('#mobileHelp').open = true; }
    installPrompt = null;
  });
  copy.addEventListener('click', async () => {
    const url = new URL('./', location.href).href;
    try { await navigator.clipboard.writeText(url); copyStatus.textContent = '주소를 복사했어요. 휴대폰 Chrome에서 열어 주세요.'; }
    catch { copyStatus.textContent = `이 주소를 휴대폰에서 열어 주세요: ${url}`; }
  });
  if (!localFile && 'serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('./sw.js').then(async reg => {
      registration = reg;
      function showUpdate() { if (reg.waiting) card.querySelector('#mobileUpdate').classList.add('visible'); }
      showUpdate();
      reg.addEventListener('updatefound', () => { const worker = reg.installing; worker?.addEventListener('statechange', showUpdate); });
      await navigator.serviceWorker.ready;
      offlineReady = true;
      showStatus();
    }).catch(() => { status.textContent = '오프라인 저장 실패 · 인터넷 연결 후 다시 열어 주세요'; });
    card.querySelector('#mobileUpdate').addEventListener('click', () => {
      if (document.querySelector('.overlay.open')) { status.textContent = '진행 중인 학습을 먼저 마무리해 주세요'; return; }
      if (registration?.waiting) {
        navigator.serviceWorker.addEventListener('controllerchange', () => location.reload(), {once:true});
        registration.waiting.postMessage({type:'ACTIVATE_UPDATE'});
      }
    });
  } else if (!localFile) { status.textContent = '오프라인 설치는 Chrome의 HTTPS 주소에서 지원돼요'; }
  const destination = new URLSearchParams(location.search).get('tab');
  if (destination === 'talk' || destination === 'home') document.querySelector(`[data-tab="${destination}"]`)?.click();
})();
</script>
