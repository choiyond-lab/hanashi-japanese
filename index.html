<style>.mobile-card{margin:0 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.mobile-row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mobile-row strong{font-size:13px}.mobile-status{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.mobile-install{border:0;border-radius:12px;background:var(--shu);color:#fff;padding:11px 13px;font-size:12px;font-weight:700;white-space:nowrap;min-height:44px}
.mobile-card summary{font-size:12px;color:var(--ink2);cursor:pointer;padding:10px 0 2px}
.mobile-card p{font-size:12px;color:var(--ink2);line-height:1.7;margin:8px 0}
.mobile-card .mobile-copy{background:var(--surface2);color:var(--ink);margin:2px 4px 2px 0}
.mobile-update{display:none}.mobile-update.visible{display:block;margin-top:8px}
@media(display-mode:standalone){#mobileInstall{display:none}}
@media(max-width:600px){input,textarea,select{font-size:16px}.overlay{height:100dvh}.rp-panel{max-height:62dvh;overflow-y:auto;overscroll-behavior:contain}.rp-inner{padding-bottom:calc(12px + env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<title>하나시 일본어</title>
<style>
:root{
  --bg:#f4efe6;--surface:#fffcf6;--surface2:#efe7da;--ink:#221d18;--ink2:#564d43;--muted:#8f857a;--line:#e3d9c9;
  --shu:#cf432a;--shu-soft:#fbe2da;--matcha:#4b8636;--matcha-soft:#e2efd9;--ai:#2c4c7f;--ai-soft:#e0e7f3;--gold:#b98a27;--gold-soft:#f6ebd0;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 8px 24px rgba(60,40,20,.06);
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15120e;--surface:#211c17;--surface2:#2c261f;--ink:#f3ece2;--ink2:#cfc4b5;--muted:#8d8375;--line:#3a3229;
  --shu:#f0694d;--shu-soft:#3b221b;--matcha:#7fc263;--matcha-soft:#1f2d19;--ai:#88a9e2;--ai-soft:#1c2537;--gold:#e0b452;--gold-soft:#342a14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#15120e;--surface:#211c17;--surface2:#2c261f;--ink:#f3ece2;--ink2:#cfc4b5;--muted:#8d8375;--line:#3a3229;
  --shu:#f0694d;--shu-soft:#3b221b;--matcha:#7fc263;--matcha-soft:#1f2d19;--ai:#88a9e2;--ai-soft:#1c2537;--gold:#e0b452;--gold-soft:#342a14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Noto Sans JP",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.4}
.jp{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
.serif{font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif}
rt{font-size:.48em;color:var(--muted);font-weight:500;letter-spacing:0}
body.no-furi rt{display:none}
body.no-pron .pron{display:none}
.pron{color:var(--ai);font-size:13px;font-weight:500}
.ko{color:var(--ink2)}
.shell{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* 상단 */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px}
.seal{width:36px;height:36px;border-radius:10px;background:var(--shu);color:#fff;display:grid;place-items:center;font-family:"Noto Serif JP",serif;font-size:20px;font-weight:700;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.flame{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px}
.flame b{color:var(--shu)}

/* 하단 탭 */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabbar-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:700}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--shu)}

/* 카드 공통 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sec-h h2{font-size:16px;margin:0}
.sec-h span{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:15px}
.btn-primary{background:var(--shu);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--shu) 70%,#000)}
.btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--shu) 70%,#000)}
.btn-ghost{background:var(--surface2);color:var(--ink)}
.btn-line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-block{width:100%}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}
.pill.new{background:var(--surface2);color:var(--muted)}
.pill.learn{background:var(--gold-soft);color:var(--gold)}
.pill.young{background:var(--ai-soft);color:var(--ai)}
.pill.mature{background:var(--matcha-soft);color:var(--matcha)}

/* 홈 */
.today{position:relative;overflow:hidden;padding:22px 20px}
.today:after{content:"話";position:absolute;right:-14px;bottom:-46px;font-family:"Noto Serif JP",serif;font-size:170px;color:var(--ink);opacity:.04;pointer-events:none}
.today-top{display:flex;gap:18px;align-items:center}
.ring{flex:none;width:92px;height:92px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:900;font-size:20px;line-height:1.05}
.ring .num small{display:block;font-size:10px;color:var(--muted);font-weight:700}
.today h1{font-size:22px;margin:0 0 6px;letter-spacing:-.5px}
.today p{margin:0;color:var(--ink2);font-size:13.5px}
.today-stats{display:flex;gap:8px;margin:16px 0}
.today-stats div{flex:1;background:var(--surface2);border-radius:12px;padding:9px 10px}
.today-stats b{display:block;font-size:18px}
.today-stats span{font-size:11px;color:var(--muted);font-weight:700}
.continue{display:flex;gap:14px;align-items:center;cursor:pointer}
.lesson-ico{flex:none;width:50px;height:50px;border-radius:15px;background:var(--surface2);display:grid;place-items:center;font-size:24px}
.lesson-ico.kana{font-family:"Noto Serif JP",serif;font-weight:700;font-size:22px;color:var(--shu)}
.continue .t{flex:1;min-width:0}
.continue small{color:var(--muted);font-weight:700;font-size:12px}
.continue b{display:block;font-size:16px}
.bar{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--matcha);border-radius:9px}
.practice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pr{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--shadow)}
.pr .e{font-size:22px}.pr b{display:block;margin:4px 0 2px;font-size:14.5px}.pr span{font-size:12px;color:var(--muted)}
.onboard h2{margin:0 0 6px;font-size:19px}
.onboard p{margin:0 0 14px;color:var(--ink2);font-size:14px}
.onboard .row{display:grid;gap:8px}

/* 코스 */
.course-h{margin:24px 2px 12px}
.course-h small{color:var(--shu);font-weight:900;font-size:12px;letter-spacing:.08em}
.course-h h2{margin:2px 0;font-size:19px}
.course-h p{margin:0;color:var(--muted);font-size:13px}
.path{position:relative;padding-left:4px}
.node{display:flex;gap:14px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:9px;cursor:pointer;width:100%;text-align:left;box-shadow:var(--shadow)}
.node .t{flex:1;min-width:0}
.node b{display:block;font-size:15px}
.node small{color:var(--muted);font-size:12px}
.node.current{border-color:var(--shu);box-shadow:0 0 0 3px var(--shu-soft)}
.node.done .lesson-ico{background:var(--matcha-soft)}
.node .chk{font-size:12px;font-weight:900;color:var(--matcha)}
.skip-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface2);font-size:13px;margin-bottom:10px}

/* 단어장 */
.search{width:100%;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);outline:none}
.search:focus{border-color:var(--shu)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.wl li:last-child{border-bottom:0}
.wl .m{flex:1;min-width:0}
.wl .jp{font-size:17px;font-weight:500;line-height:1.6}
.wl .ko{font-size:13px}
.wl .r{flex:none;text-align:right;font-size:11px;color:var(--muted)}
.wl .r .pill{margin-bottom:3px}
.group-t{font-size:12px;font-weight:900;color:var(--muted);margin:18px 2px 0;letter-spacing:.04em}

/* 기록 */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
.kpi b{display:block;font-size:22px}.kpi span{font-size:11px;color:var(--muted);font-weight:700}
.stack{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--surface2);margin:12px 0 10px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:12px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--ai);min-height:2px}
.bars i.today{background:var(--shu)}
.bars em{font-style:normal;font-size:10px;color:var(--muted)}
.bars s{text-decoration:none;font-size:10px;color:var(--ink2);font-weight:700}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row b{display:block;font-size:14px}.set-row small{color:var(--muted);font-size:12px}
.switch{flex:none;width:48px;height:28px;border-radius:99px;border:0;background:var(--line);position:relative;transition:.2s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--matcha)}.switch.on:after{left:23px}
.mini-seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;flex:none}
.mini-seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.mini-seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* 오버레이 (학습·레슨·롤플레이) */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
.overlay.open{display:flex}
.ov-top{flex:none;max-width:560px;width:100%;margin:0 auto;display:flex;align-items:center;gap:12px;padding:14px 16px 8px}
.ov-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.ov-inner{max-width:560px;margin:0 auto;padding:6px 16px 24px}
.ov-foot{flex:none;border-top:1px solid var(--line);background:var(--surface)}
.ov-foot-inner{max-width:560px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.x-btn{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:var(--surface2);font-size:18px;color:var(--ink2)}
.prog{flex:1;height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--matcha);border-radius:99px;transition:width .3s}
.ov-title{flex:1;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 연습 문제 */
.ex{min-height:100%;display:flex;flex-direction:column}
.ex-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:var(--shu);letter-spacing:.03em}
.ex-tag.new{color:var(--gold)}
.ex-prompt{font-size:19px;font-weight:800;margin:6px 0 18px;letter-spacing:-.3px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 18px;text-align:center;box-shadow:var(--shadow);margin-bottom:16px}
.big-kana{font-family:"Noto Serif JP",serif;font-size:clamp(84px,26vw,128px);line-height:1.1;font-weight:500}
.big-word{font-size:clamp(32px,9vw,46px);font-weight:500;line-height:1.6}
.big-sent{font-size:clamp(21px,5.6vw,27px);font-weight:500;line-height:1.75}
.big-ko{font-size:clamp(20px,5.5vw,25px);font-weight:800;line-height:1.5}
.big-hangul{font-size:clamp(46px,14vw,70px);font-weight:900}
.stage .pron{margin-top:6px;font-size:14px}
.stage .ko{margin-top:6px}
.audio-row{display:flex;gap:8px;justify-content:center;margin-top:14px}
.audio{border:0;background:var(--ai-soft);color:var(--ai);border-radius:99px;padding:9px 15px;font-weight:800;font-size:13px}
.big-audio{width:96px;height:96px;border-radius:50%;border:0;background:var(--ai);color:#fff;font-size:38px;box-shadow:0 4px 0 color-mix(in srgb,var(--ai) 65%,#000)}
.big-audio:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ai) 65%,#000)}
.opts{display:grid;gap:9px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:13px 15px;font-size:16px;font-weight:600;line-height:1.5;min-height:58px}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:800}
.opt>span:last-child{flex:1;min-width:0;overflow-wrap:anywhere}
/* 보기 문장은 반드시 한 덩어리(span)로: ruby가 flex 칸으로 쪼개지지 않게 */
.opt.kana{justify-content:center;font-family:"Noto Serif JP",serif;font-size:34px;padding:10px}
.opt.kana .k{display:none}
.opt.jp-opt{font-family:"Noto Sans JP",sans-serif;font-size:18px;font-weight:500}
.opt:hover:not(:disabled){border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.opt.correct{border-color:var(--matcha);background:var(--matcha-soft);color:var(--matcha)}
.opt.wrong{border-color:var(--shu);background:var(--shu-soft);color:var(--shu)}
.opt:disabled{opacity:1;cursor:default}
.opt.dim{opacity:.45}
.type-in{width:100%;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:center;font-size:26px;font-weight:800;outline:none}
.type-in:focus{border-color:var(--ai)}
.answer-zone{min-height:66px;padding:10px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:13px;padding:8px 13px;font-family:"Noto Sans JP",sans-serif;font-size:19px;font-weight:500;line-height:1.55}
.tile.ghost{visibility:hidden}
.blank{display:inline-block;min-width:2.4em;border-bottom:3px solid var(--shu);color:var(--shu);margin:0 3px;line-height:1.3}
.blank.fill{border-color:var(--matcha);color:var(--matcha)}
.mic{width:100px;height:100px;border-radius:50%;border:0;background:var(--shu);color:#fff;font-size:40px;box-shadow:0 4px 0 color-mix(in srgb,var(--shu) 65%,#000);display:block;margin:6px auto 10px}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--shu) 50%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.heard{min-height:24px;text-align:center;font-size:14px;color:var(--ink2)}
.speak-alt{display:flex;gap:8px;justify-content:center;margin-top:8px}
.intro-note{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--gold-soft);color:var(--ink2);font-size:13px;text-align:left}

/* 피드백 시트 */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(105%);transition:transform .22s ease}
.fb.show{transform:none}
.fb-inner{max-width:560px;margin:0 auto;padding:18px 16px calc(14px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:var(--surface);box-shadow:0 -8px 30px rgba(0,0,0,.12);border-top:4px solid var(--matcha)}
.fb.ng .fb-inner{border-top-color:var(--shu)}
.fb h3{margin:0 0 10px;font-size:18px;color:var(--matcha);display:flex;align-items:center;gap:8px}
.fb.ng h3{color:var(--shu)}
.fb .ans{background:var(--surface2);border-radius:14px;padding:12px 14px;margin-bottom:12px;position:relative}
.fb .ans .jp{font-size:19px;font-weight:500;line-height:1.7;padding-right:44px}
.fb .ans .play{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--ai-soft);color:var(--ai)}
.fb .mine{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g-easy{background:var(--ai-soft);color:var(--ai)}
.ex-mini{margin-top:6px;padding:6px 10px;border-left:3px solid var(--line);font-size:13px}.ex-mini .jp{display:block;font-size:14px;line-height:1.7}.ex-mini .ko{font-size:12px;color:var(--muted)}
.ex-card{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--surface2);text-align:left}.ex-card b{font-size:12px;color:var(--ink2)}.ex-card .jp{display:block;font-size:17px;line-height:1.8}.ex-card .ko{font-size:13px}.ex-card button{float:right;border:0;background:var(--ai-soft);color:var(--ai);border-radius:99px;padding:5px 10px;font-size:12px}
.grades button{border-radius:14px;padding:12px 6px;font-weight:800;border:0;font-size:14px}
.grades small{display:block;font-size:11px;font-weight:600;opacity:.8}
.g-again{background:var(--shu-soft);color:var(--shu)}
.g-hard{background:var(--gold-soft);color:var(--gold)}
.g-good{background:var(--matcha-soft);color:var(--matcha)}

/* 결과 */
.done-wrap{text-align:center;padding:26px 4px}
.done-wrap .big{font-size:64px}
.done-wrap h2{margin:6px 0 4px;font-size:24px}
.done-wrap p{color:var(--ink2);margin:0 0 18px}

/* 레슨 */
.scene{background:var(--ink);color:var(--bg);border-radius:20px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.scene small{opacity:.7;font-weight:700;font-size:12px}
.scene h2{margin:4px 0 6px;font-size:21px}
.scene p{margin:0;opacity:.85;font-size:13.5px}
.scene .bg{position:absolute;right:12px;top:6px;font-size:58px;opacity:.9}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:13px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:800;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;display:flex;flex-direction:column}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg .who{font-size:11px;font-weight:800;color:var(--muted);margin:0 6px 3px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 14px;cursor:pointer;box-shadow:var(--shadow)}
.msg.me .bubble{background:var(--ai-soft);border-color:transparent;border-radius:18px 18px 6px 18px}
.bubble .jp{font-size:17px;line-height:1.75}
.bubble .ko{font-size:12.5px;margin-top:2px}
.bubble.playing{outline:2px solid var(--ai)}
.chat.hide-ko .bubble .ko{display:none}
.tool-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tool-row .btn{padding:9px 14px;font-size:13px;border-radius:12px}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.kcell{aspect-ratio:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.kcell b{font-family:"Noto Serif JP",serif;font-size:26px;font-weight:500;line-height:1.1}
.kcell span{font-size:11px;color:var(--muted)}
.kcell.wide b{font-size:19px}
.tip{background:var(--gold-soft);border-radius:16px;padding:16px;font-size:14px;color:var(--ink2);line-height:1.7}
.tip b{color:var(--ink)}

/* 롤플레이 */
.rp-panel{background:var(--surface);border-top:1px solid var(--line)}
.rp-inner{max-width:560px;margin:0 auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.rp-say{font-size:12px;font-weight:800;color:var(--muted)}
.rp-ko{font-size:17px;font-weight:800;margin:2px 0 12px}
.rp-actions{display:flex;gap:8px}
.rp-actions .btn{flex:1;padding:12px 8px;font-size:14px}
.rp-opts{display:grid;gap:8px;margin-top:10px}
.opt-row{display:flex;gap:8px;align-items:stretch}.opt-row .opt{flex:1;min-width:0}
.opt-say{flex:none;width:52px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--ai-soft);color:var(--ai);font-size:18px}
.opt-say:active{transform:translateY(2px)}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* AI 회화 */
.ai-status{display:flex;gap:12px;align-items:flex-start}
.ai-status .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--muted)}
.ai-status .dot.on{background:var(--matcha);box-shadow:0 0 0 4px var(--matcha-soft)}
.ai-status b{display:block}.ai-status p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.key-row{display:flex;gap:8px;margin-top:12px}
.key-row input{flex:1;min-width:0;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);outline:none;font-size:14px}
.key-row input:focus{border-color:var(--shu)}
.fine{font-size:11.5px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.scene-list{display:grid;gap:8px}
.scene-btn{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);width:100%}
.scene-btn .t{flex:1;min-width:0}.scene-btn b{display:block;font-size:14.5px}.scene-btn small{color:var(--muted);font-size:12px}
.custom-scene{display:flex;gap:8px}
.custom-scene input{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);outline:none}
.ai-input{display:flex;gap:8px;align-items:flex-end}
.ai-input textarea{flex:1;min-width:0;resize:none;max-height:120px;padding:11px 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);outline:none;font-family:"Noto Sans JP","Noto Sans KR",sans-serif;font-size:16px;line-height:1.45}
.ai-input textarea:focus{border-color:var(--ai)}
.ai-mic,.ai-send{flex:none;width:44px;height:44px;border-radius:50%;border:0;font-size:18px}
.ai-mic{background:var(--surface2)}.ai-mic.on{background:var(--shu);color:#fff;animation:pulse 1.2s infinite}
.ai-send{background:var(--shu);color:#fff}
.ai-tools{display:flex;gap:8px;align-items:center;margin-top:8px}
.ai-tools button{border:0;background:var(--surface2);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.ai-tools span{margin-left:auto;font-size:12px;color:var(--muted)}
.ai-hints{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.ai-hints:empty{display:none}
.hint-chip{text-align:left;border:1.5px dashed var(--gold);background:var(--gold-soft);border-radius:14px;padding:8px 12px}
.hint-chip .jp{font-size:15px}.hint-chip .ko{font-size:12px}
.fbk{margin-top:6px;max-width:100%;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.55;text-align:left}
.fbk.good{background:var(--matcha-soft);color:var(--matcha);font-weight:700}
.fbk.minor{background:var(--ai-soft)}.fbk.fix{background:var(--shu-soft)}.fbk.translate{background:var(--gold-soft)}
.fbk .lab{font-size:11.5px;font-weight:900;letter-spacing:.02em}
.fbk.minor .lab{color:var(--ai)}.fbk.fix .lab{color:var(--shu)}.fbk.translate .lab{color:var(--gold)}
.fbk .jp{font-size:16px;color:var(--ink);display:block;margin:3px 0 1px}
.fbk .ex{color:var(--ink2);margin-top:4px}
.fbk .save{margin-top:6px;border:0;border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:800;background:var(--surface);color:var(--ink2)}
.fbk .save.on{background:var(--matcha);color:#fff}
.fbk.pending{background:var(--surface2);color:var(--muted)}
.msg .mini{display:flex;gap:6px;margin:4px 6px 0}
.msg .mini button{border:0;background:none;font-size:12px;color:var(--muted);padding:2px 4px}
.ai-err{align-self:center;text-align:center;font-size:13px;color:var(--shu);background:var(--shu-soft);padding:10px 14px;border-radius:14px}
.ai-err button{margin-top:6px}
.sum-item{display:flex;gap:10px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.sum-item input{margin-top:6px;width:18px;height:18px;accent-color:var(--matcha);flex:none}
.sum-item .jp{font-size:17px;line-height:1.6}
.sum-item .ko{font-size:13px}.sum-item .why{font-size:12px;color:var(--muted);margin-top:2px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-80px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:50;transition:.25s}
.toast.show{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
@media (max-width:380px){.kgrid{grid-template-columns:repeat(4,1fr)}.practice-grid{grid-template-columns:1fr}}
.rp-progress{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.rp-type{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:12px}
.rp-type label,.rp-type p{grid-column:1/-1}
.rp-type label{font-size:12px;color:var(--ink2)}
.rp-type input{min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:16px}
.rp-compare{background:var(--matcha-soft);border-radius:14px;padding:12px;margin-top:12px;font-size:13px}

function altsFor(line){
  if(!ALT_INDEX){
    ALT_INDEX={};
    for(const [k,a] of Object.entries(PHRASE_ALTS))ALT_INDEX[k]=[...a];
    for(const [raw,a] of Object.entries(ALT_BY_RAW)){const k=altKey(parseLine(raw));ALT_INDEX[k]=[...(ALT_INDEX[k]||[]),...a]}
  }

}

sents:[[1,"인사·소개","はじめまして。|韓国(かんこく)|から|来(き)ました。","처음 뵙겠습니다. 한국에서 왔습니다.","첫 만남에서 인사와 출신을 함께 말해 보세요."],[1,"인사·소개","私(わたし)|は|ミンジ|です。|よろしく|お願(ねが)い|します。","저는 민지입니다. 잘 부탁드립니다.","민지 자리에 자신의 이름을 넣어 연습해 보세요."],[1,"인사·소개","お名前(なまえ)|を|教(おし)えて|いただけます|か。","성함을 알려 주시겠어요?","「〜ていただけますか」는 정중하게 부탁하는 표현이에요."],[1,"공부·학습","日本語(にほんご)|を|勉強(べんきょう)|して|います。","일본어를 공부하고 있어요.","「〜ています」로 요즘 계속하고 있는 일을 말해요."],[1,"공부·학습","もう一度(いちど)、|ゆっくり|お願(ねが)い|します。","다시 한번 천천히 부탁드려요.","못 알아들었다면 이 문장으로 대화를 이어 가세요."],[1,"공부·학습","それ|は|どういう|意味(いみ)|です|か。","그건 무슨 뜻인가요?","모르는 단어나 표현의 뜻을 물을 때 써요."],[1,"음식·식당","日本(にほん)|の|食(た)べ物(もの)|が|好(す)き|です。","일본 음식을 좋아해요.","「〜が好きです」에 자신이 좋아하는 것을 넣어 보세요."],[1,"인사·소개","ありがとう|ございます。|助(たす)かりました。","감사합니다. 덕분에 도움이 됐어요.","도움을 받은 뒤 감사의 뜻을 구체적으로 전해요."],[2,"음식·식당","すみません、|注文(ちゅうもん)|して|も|いい|です|か。","저기요, 주문해도 될까요?","직원을 부를 때 「すみません」을 먼저 붙이면 자연스러워요."],[2,"음식·식당","おすすめ|は|何(なん)|です|か。","추천 메뉴는 무엇인가요?","가게에서 무엇을 고를지 고민될 때 물어보세요."],[2,"음식·식당","これ|を|一(ひと)つ|お願(ねが)い|します。","이것 하나 부탁드려요.","메뉴나 물건을 가리키며 말할 수 있어요."],[2,"음식·식당","店内(てんない)|で|お願(ねが)い|します。","매장에서 먹고 갈게요.","포장이라면 「持ち帰りでお願いします」로 바꿔요."],[2,"음식·식당","お会計(かいけい)|を|お願(ねが)い|します。","계산 부탁드려요.","식사를 마치고 계산을 요청할 때 써요."],[2,"교통·길 찾기","この|電車(でんしゃ)|は|新宿(しんじゅく)|に|行(い)きます|か。","이 전철은 신주쿠에 가나요?","「新宿」 자리에 목적지를 넣어 확인해 보세요."],[2,"교통·길 찾기","駅(えき)|まで|歩(ある)いて|何分(なんぷん)|ぐらい|です|か。","역까지 걸어서 몇 분 정도 걸리나요?","「ぐらい」는 대략적인 정도를 나타내요."],[2,"음식·식당","七時(しちじ)|に|二名(にめい)|で|予約(よやく)|した|キム|です。","7시에 두 명으로 예약한 김입니다.","예약 시간, 인원, 이름을 함께 말하면 확인하기 쉬워요."],[3,"취미·여가","週末(しゅうまつ)|は|何(なに)|を|して|過(す)ごしました|か。","주말에는 무엇을 하며 보내셨어요?","상대가 자세히 답할 수 있는 질문으로 대화를 시작해요."],[3,"취미·여가","最近(さいきん)、|料理(りょうり)|を|する|の|に|はまって|います。","요즘 요리하는 데 푹 빠져 있어요.","「〜にはまっています」는 요즘 몰두하는 취미에 잘 어울려요."],[3,"취미·여가","どんな|映画(えいが)|が|好(す)き|です|か。","어떤 영화를 좋아하세요?","상대의 답에 「おすすめはありますか」를 붙여 더 물어보세요."],[3,"친구·관계","よかったら、|今度(こんど)|一緒(いっしょ)|に|行(い)きません|か。","괜찮으시면 다음에 같이 가지 않을래요?","「よかったら」로 상대에게 부담을 덜 주며 제안해요."],[3,"일상생활","土曜日(どようび)|の|午後(ごご)|なら|空(あ)いて|います。","토요일 오후라면 시간이 있어요.","「〜なら」로 가능한 조건을 말해요."],[3,"친구·관계","駅(えき)|の|東口(ひがしぐち)|で|待(ま)ち合(あ)わせましょう。","역 동쪽 출구에서 만나요.","약속은 출구처럼 구체적인 장소로 정해 보세요."],[3,"일상생활","何時(なんじ)ごろ|が|いい|です|か。","몇 시쯤이 좋으세요?","「ごろ」는 시각의 대략적인 범위를 나타내요."],[3,"여행·숙박","そう|な|ん|です|ね。|私(わたし)|も|行(い)って|みたい|です。","그렇군요. 저도 가 보고 싶어요.","맞장구 뒤에 자신의 생각을 더하면 대화가 이어져요."],[4,"교통·길 찾기","電車(でんしゃ)|が|遅(おく)れて|いて、|十分(じゅっぷん)|ほど|遅(おく)れそう|です。","전철이 지연되고 있어서 10분 정도 늦을 것 같아요.","이유와 예상 도착 지연 시간을 함께 알려 주세요."],[4,"서비스·생활시설","申(もう)し訳(わけ)|ありません。|別(べつ)|の|日(ひ)|に|変更(へんこう)|できます|か。","죄송합니다. 다른 날로 변경할 수 있을까요?","예약이나 약속을 바꿀 때 사과와 요청을 함께 말해요."],[4,"곤란한 상황","昨日(きのう)、|この|店(みせ)|に|傘(かさ)|を|忘(わす)れた|と|思(おも)う|ん|です|が。","어제 이 가게에 우산을 두고 간 것 같은데요.","「〜と思うんですが」로 상황을 부드럽게 꺼낼 수 있어요."],[4,"공부·학습","もう少(すこ)し|詳(くわ)しく|教(おし)えて|いただけます|か。","조금 더 자세히 알려 주시겠어요?","설명이 부족할 때 정중하게 추가 설명을 부탁해요."],[4,"건강·몸","今日(きょう)|は|体調(たいちょう)|が|悪(わる)い|ので、|早(はや)め|に|帰(かえ)って|も|いい|です|か。","오늘은 몸 상태가 안 좋아서 조금 일찍 돌아가도 될까요?","「〜ので」로 이유를, 「〜てもいいですか」로 허락 요청을 말해요."],[4,"음식·식당","もし|可能(かのう)|なら、|窓側(まどがわ)|の|席(せき)|を|お願(ねが)い|できます|か。","가능하다면 창가 자리를 부탁드려도 될까요?","「もし可能なら」는 선택이나 변경을 부드럽게 부탁할 때 써요."],[4,"서비스·생활시설","確認(かくにん)|したい|の|です|が、|集合(しゅうごう)|は|九時(くじ)|で|合(あ)って|います|か。","확인하고 싶은데, 모이는 시간이 9시가 맞나요?","알고 있는 내용을 다시 확인해 오해를 줄여요."],[4,"곤란한 상황","手伝(てつだ)って|いただける|と|助(たす)かります。","도와주시면 감사하겠습니다.","도움이 필요하다는 뜻을 정중하게 전하는 표현이에요."],[5,"생각·의견","私(わたし)|は、|実際(じっさい)|に|話(はな)して|みる|こと|が|大切(たいせつ)|だ|と|思(おも)います。","저는 실제로 말해 보는 것이 중요하다고 생각해요.","「〜と思います」로 자신의 의견임을 분명히 해요."],[5,"생각·의견","確(たし)か|に|そう|です|ね。|ただ、|別(べつ)|の|考(かんが)え方(かた)|も|ある|と|思(おも)います。","확실히 그렇네요. 다만 다른 관점도 있다고 생각해요.","먼저 공감한 뒤 다른 생각을 부드럽게 덧붙여요."],[5,"문화·사회","例(たと)えば、|どんな|ところ|が|違(ちが)う|と|感(かん)じました|か。","예를 들면 어떤 점이 다르다고 느끼셨어요?","구체적인 경험을 물으면 이야기의 폭이 넓어져요."],[5,"생각·의견","なるほど。|そう|考(かんが)えた|理由(りゆう)|を|聞(き)いて|も|いい|です|か。","그렇군요. 그렇게 생각하신 이유를 여쭤봐도 될까요?","상대의 의견을 판단하기 전에 이유를 들어 보세요."],[5,"생각·의견","うまく|言(い)えない|ん|です|が、|少(すこ)し|違(ちが)う|気(き)|が|します。","잘 표현하기 어렵지만, 조금 다른 것 같아요.","표현이 바로 떠오르지 않아도 대화를 계속할 수 있어요."],[5,"공부·학습","つまり、|自分(じぶん)|の|ペース|で|続(つづ)ける|こと|が|大事(だいじ)な|ん|です|ね。","그러니까 자신의 속도로 계속하는 것이 중요하다는 말씀이군요.","「つまり」로 들은 내용을 자신의 말로 요약해 확인해요."],[5,"일상생활","話(はなし)|は|変(か)わります|が、|最近(さいきん)|何(なに)|か|面白(おもしろ)い|こと|は|ありました|か。","화제를 바꿔서, 요즘 무슨 재미있는 일 있었나요?","주제를 바꾼다는 신호를 주고 새로운 질문을 꺼내요."],[5,"생각·의견","私(わたし)|の|説明(せつめい)|で|伝(つた)わりました|か。","제 설명으로 뜻이 전달됐나요?","설명 뒤에 서로 같은 뜻으로 이해했는지 확인해요."],[1,"인사·소개","お会(あ)い|できて|うれしい|です。","만나 뵙게 되어 기뻐요.","첫 만남이나 기다리던 만남에서 반가움을 전해요."],[1,"인사·소개","こちら|こそ、|よろしく|お願(ねが)い|します。","저야말로 잘 부탁드립니다.","상대의 인사에 「こちらこそ」로 응답해요."],[1,"인사·소개","また|明日(あした)|会(あ)いましょう。","내일 또 만나요.","가까운 시일에 다시 만날 사람에게 하는 인사예요."],[1,"인사·소개","そろそろ|寝(ね)ます。|おやすみなさい。","슬슬 잘게요. 안녕히 주무세요.","「そろそろ」는 이제 그럴 때가 되었다는 느낌이에요."],[1,"인사·소개","今日(きょう)|は|これ|で|失礼(しつれい)|します。","오늘은 이만 실례하겠습니다.","자리를 떠나거나 대화를 마칠 때 정중하게 말해요."],[1,"인사·소개","お久(ひさ)しぶり|です。|お元気(げんき)|でした|か。","오랜만입니다. 잘 지내셨어요?","오랫동안 못 만난 사람에게 근황을 물어요."],[1,"인사·소개","すみません、|少(すこ)し|待(ま)って|ください。","죄송하지만 조금 기다려 주세요.","「少し」를 붙여 짧은 기다림을 부탁해요."],[1,"인사·소개","どうぞ、|座(すわ)って|ください。","편하게 앉으세요.","「どうぞ」를 먼저 말하면 권하는 뜻이 자연스러워요."],[1,"가족·사람","家族(かぞく)|は|四人(よにん)|です。","가족은 네 명이에요.","사람 수를 셀 때 네 명은 「よにん」이라고 읽어요."],[1,"가족·사람","父(ちち)|と|母(はは)|は|韓国(かんこく)|に|います。","아버지와 어머니는 한국에 계세요.","사람이 있는 곳은 「場所にいます」로 말해요."],[1,"가족·사람","姉(あね)|は|大学生(だいがくせい)|です。","언니는 대학생이에요.","자기 누나·언니를 남에게 말할 때 「姉」를 써요."],[1,"가족·사람","兄弟(きょうだい)|は|います|か。","형제자매가 있나요?","「兄弟」는 문맥에 따라 형제자매 전체를 가리켜요."],[1,"가족·사람","弟(おとうと)|は|まだ|子供(こども)|です。","남동생은 아직 아이예요.","「まだ」는 현재까지 그 상태가 계속됨을 나타내요."],[1,"친구·관계","友達(ともだち)|と|住(す)んで|います。","친구와 함께 살고 있어요.","누구와 함께 사는지 「人と」로 말해요."],[1,"가족·사람","これ|は|祖母(そぼ)|の|写真(しゃしん)|です。","이것은 할머니의 사진이에요.","「の」로 사진과 사람의 관계를 나타내요."],[1,"가족·사람","お母(かあ)さん|は|お元気(げんき)|です|か。","어머니는 잘 지내시나요?","상대의 어머니를 말할 때는 「お母さん」을 써요."],[1,"숫자·시간","今日(きょう)|は|何月(なんがつ)|何日(なんにち)|です|か。","오늘은 몇 월 며칠인가요?","월은 「何月」, 날짜는 「何日」로 물어요."],[1,"숫자·시간","今(いま)、|何時(なんじ)|です|か。","지금 몇 시인가요?","시간을 물을 때의 기본 표현이에요."],[1,"일상생활","朝(あさ)|は|七時(しちじ)|に|起(お)きます。","아침에는 7시에 일어나요.","시각 뒤에 「に」를 붙여 행동하는 때를 말해요."],[1,"일상생활","夜(よる)|は|十一時(じゅういちじ)|に|寝(ね)ます。","밤에는 11시에 자요.","반복하는 생활 습관은 「〜ます」로 말해요."],[1,"일상생활","明日(あした)|は|月曜日(げつようび)|です。","내일은 월요일이에요.","요일 이름 뒤에 「です」를 붙여 말해요."],[1,"일상생활","昨日(きのう)|は|休(やす)み|でした。","어제는 쉬는 날이었어요.","명사의 과거형은 「〜でした」예요."],[1,"일상생활","一日(いちにち)|に|二回(にかい)、|歯(は)|を|磨(みが)きます。","하루에 두 번 이를 닦아요.","「一日に〜回」로 하루의 횟수를 말해요."],[1,"숫자·시간","ここ|に|三(みっ)つ|あります。","여기에 세 개 있어요.","일반적인 물건 세 개는 「三つ」로 셀 수 있어요."],[1,"일상생활","家(いえ)|は|学校(がっこう)|の|近(ちか)く|です。","집은 학교 근처예요.","「〜の近く」로 기준 장소의 주변을 말해요."],[1,"일상생활","部屋(へや)|に|机(つくえ)|と|椅子(いす)|が|あります。","방에 책상과 의자가 있어요.","물건이 있는 곳은 「場所に〜があります」예요."],[1,"일상생활","かばん|の|中(なか)|に|鍵(かぎ)|が|あります。","가방 안에 열쇠가 있어요.","「〜の中」는 사물의 안쪽을 뜻해요."],[1,"서비스·생활시설","トイレ|は|どこ|です|か。","화장실은 어디인가요?","장소를 찾을 때 이름 뒤에 「はどこですか」를 붙여요."],[1,"일상생활","この|本(ほん)|は|私(わたし)|の|です。","이 책은 제 것이에요.","「私の」 뒤에 이미 아는 물건 이름을 생략할 수 있어요."],[1,"일상생활","窓(まど)|を|開(あ)けて|も|いい|です|か。","창문을 열어도 될까요?","「〜てもいいですか」는 허락을 구하는 표현이에요."],[1,"일상생활","ドア|を|閉(し)めて|ください。","문을 닫아 주세요.","「〜てください」로 행동을 부탁해요."],[1,"일상생활","今日(きょう)|は|家(いえ)|で|休(やす)みます。","오늘은 집에서 쉴 거예요.","행동이 일어나는 장소에는 「で」를 써요."],[1,"일상생활","何(なに)|を|して|います|か。","무엇을 하고 있나요?","지금 하는 행동을 묻는 기본 질문이에요."],[1,"일상생활","今(いま)、|テレビ|を|見(み)て|います。","지금 텔레비전을 보고 있어요.","진행 중인 행동은 「〜ています」로 말해요."],[1,"일상생활","学校(がっこう)|へ|は|歩(ある)いて|行(い)きます。","학교에는 걸어서 가요.","「歩いて」로 걸어서 이동함을 나타내요."],[1,"일상생활","帰(かえ)ったら|電話(でんわ)|します。","돌아가면 전화할게요.","「〜たら」는 이 문장에서 앞 행동 이후를 나타내요."],[1,"음식·식당","朝(あさ)|ご飯(はん)|は|もう|食(た)べました。","아침 식사는 이미 먹었어요.","끝낸 일을 말할 때 「もう〜ました」를 써요."],[1,"음식·식당","まだ|昼(ひる)|ご飯(はん)|を|食(た)べて|いません。","아직 점심을 먹지 않았어요.","「まだ〜ていません」은 아직 하지 않았다는 뜻이에요."],[1,"음식·식당","お茶(ちゃ)|と|コーヒー、|どちら|が|いい|です|か。","차와 커피 중 어느 것이 좋으세요?","두 가지 중 하나를 고를 때 「どちら」로 물어요."],[1,"음식·식당","牛乳(ぎゅうにゅう)|は|飲(の)みません。","우유는 마시지 않아요.","「〜ません」으로 하지 않는 행동을 말해요."],[1,"음식·식당","この|パン|は|おいしい|です。","이 빵은 맛있어요.","먹은 음식에 대해 짧게 감상을 전해요."],[1,"음식·식당","おなか|が|すきました。","배가 고파요.","배고픈 상태를 나타내는 자주 쓰는 표현이에요."],[1,"음식·식당","のど|が|渇(かわ)きました。","목이 말라요.","물을 마시고 싶은 상태를 말해요."],[1,"음식·식당","いただきます。|おいしそう|です|ね。","잘 먹겠습니다. 맛있어 보이네요.","먹기 전에는 「おいしそう」로 보이는 인상을 말해요."],[1,"공부·학습","この|漢字(かんじ)|は|何(なん)と|読(よ)みます|か。","이 한자는 어떻게 읽나요?","모르는 한자의 읽는 법을 물을 때 써요."],[1,"공부·학습","ここ|に|名前(なまえ)|を|書(か)いて|ください。","여기에 이름을 써 주세요.","「ここに」로 쓰는 위치를 알려 줘요."],[1,"공부·학습","ひら|が|な|は|読(よ)めます。","히라가나는 읽을 수 있어요.","「読めます」는 읽는  부족하면 나중에 제출할 수 있나요?","준비물이 미비한 경우의 처리 방법을 물어요."],[4,"서비스·생활시설","手数料(てすうりょう)|を|含(ふく)めた|合計(ごうけい)|金額(きんがく)|を|教(おし)えて|ください。","수수료를 포함한 총금액을 알려 주세요.","「〜を含めた」로 포함해야 할 항목을 분명히 해요."],[4,"서비스·생활시설","解約(かいやく)|する|前(まえ)|に、|費用(ひよう)|が|かかる|か|確認(かくにん)|したい|です。","해약하기 전에 비용이 발생하는지 확인하고 싶어요.","「〜か」로 확인할 의문 내용을 문장 안에 넣어요."],[4,"직장·업무","急(きゅう)な|お願(ねが)い|で|申(もう)し訳(わけ)|ありません|が、|日程(にってい)|を|調整(ちょうせい)|できます|か。","갑작스러운 부탁이라 죄송하지만 일정을 조율할 수 있을까요?","상대에게 부담이 되는 요청 전에 양해를 구해요."],[4,"직장·업무","別(べつ)|の|用事(ようじ)|が|入(はい)って|しまい、|その|時間(じかん)|に|伺(うかが)えなく|なりました。","다른 일이 생겨서 그 시간에 찾아뵐 수 없게 됐어요.","「伺う」는 방문하거나 묻는 행동을 낮추어 말하는 표현이에요."],[4,"직장·업무","明日(あした)|の|午前中(ごぜんちゅう)|まで|待(ま)って|いただく|こと|は|可能(かのう)|でしょう|か。","내일 오전까지 기다려 주시는 것이 가능할까요?","기한 연장을 정중하게 부탁할 때 써요."],[4,"직장·업무","今(いま)|の|作業(さぎょう)|が|終(お)わり|次第(しだい)、|すぐ|に|確認(かくにん)|します。","지금 작업이 끝나는 대로 바로 확인할게요.","「動詞ます형 어간＋次第」는 끝나자마자 한다는 뜻이에요."],[4,"직장·업무","どちら|を|先(さき)|に|進(すす)めれば|よい|か、|指示(しじ)|を|いただけます|か。","어느 쪽을 먼저 진행하면 좋을지 지시해 주시겠어요?","업무의 우선순위가 모호할 때 확인해요."],[4,"직장·업무","資料(しりょう)|を|送(おく)った|つもり|でした|が、|添付(てんぷ)|を|忘(わす)れて|いました。","자료를 보낸 줄 알았는데 첨부를 잊었어요.","「〜たつもり」로 자신이 했다고 생각했던 일을 말해요."],[4,"직장·업무","訂正(ていせい)|した|もの|を|送(おく)り|直(なお)します|ので、|ご確認(かくにん)|ください。","수정한 것을 다시 보내 드리니 확인해 주세요.","「動詞ます형 어간＋直す」는 다시 한다는 뜻이에요."],[4,"직장·업무","説明(せつめい)|が|足(た)りず、|誤解(ごかい)|させて|しまって|申(もう)し訳(わけ)|ありません。","설명이 부족해서 오해하게 해 드려 죄송합니다.","설명 부족으로 생긴 오해에 대해 사과해요."],[4,"직장·업무","この|部分(ぶぶん)|だけ、|もう少(すこ)し|具体的(ぐたいてき)|に|説明(せつめい)|して|いただけます|か。","이 부분만 좀 더 구체적으로 설명해 주실 수 있나요?","전체를 다시 묻기보다 이해되지 않은 부분을 짚어 줘요."],[4,"직장·업무","こちら|の|理解(りかい)|で|合(あ)って|いる|か、|確認(かくにん)|させて|ください。","제가 이해한 내용이 맞는지 확인하게 해 주세요.","자신의 이해를 요약하기 전에 쓰는 표현이에요."],[4,"일상생활","ごみ|の|出(だ)し方(かた)|は|地域(ちいき)|によって|違(ちが)う|と|聞(き)きました。","쓰레기 배출 방법은 지역마다 다르다고 들었어요.","「〜によって違う」로 기준에 따른 차이를 나타내요."],[4,"일상생활","この|家具(かぐ)|を|捨(す)てたい|の|です|が、|申(もう)し込(こ)み|が|必要(ひつよう)|です|か。","이 가구를 버리고 싶은데 신청이 필요한가요?","대형 폐기물 배출 전에 지역 절차를 확인해요."],[4,"일상생활","回収日(かいしゅうび)|は|分(わ)かった|の|です|が、|何時(なんじ)|まで|に|出(だ)せば|いい|です|か。","수거일은 알겠는데 몇 시까지 내놓으면 되나요?","「〜までに」로 완료해야 하는 시한을 확인해요."],[4,"친구·관계","隣(となり)|に|引(ひ)っ越(こ)して|きた|キム|と|申(もう)します。|よろしく|お願(ねが)い|します。","옆집에 이사 온 김이라고 합니다. 잘 부탁드립니다.","이웃에게 이사 인사를 할 때 이름과 관계를 소개해요."],[4,"친구·관계","夜(よる)|は|音(おと)|が|響(ひび)き|やすい|ので、|少(すこ)し|気(き)|を|つけて|いただけます|か。","밤에는 소리가 잘 울려서 조금 주의해 주실 수 있나요?","상황을 설명한 뒤 구체적인 배려를 정중하게 부탁해요."],[4,"일상생활","清掃(せいそう)|活動(かつどう)|に|は、|どんな|服装(ふくそう)|で|参加(さんか)|すれば|いい|です|か。","청소 활동에는 어떤 복장으로 참가하면 되나요?","처음 참여하는 지역 활동의 준비 사항을 물어요."],[4,"서비스·생활시설","点検(てんけん)|の|日(ひ)|は|留守(るす)|な|ので、|別(べつ)|の|日(ひ)|に|して|いただけます|か。","점검일에는 집을 비우니 다른 날로 해 주실 수 있나요?","불가능한 사정을 말한 뒤 일정 변경을 요청해요."],[4,"서비스·생활시설","掲示板(けいじばん)|の|お知(し)らせ|を、|写真(しゃしん)|に|撮(と)って|も|かまいません|か。","게시판 안내문을 사진으로 찍어도 괜찮을까요?","「〜てもかまいませんか」는 허락을 묻는 정중한 표현이에요."],[4,"날씨·계절","天気(てんき)|が|悪化(あっか)|しそう|な|ので、|予定(よてい)|を|見直(みなお)したい|です。","날씨가 나빠질 것 같아서 일정을 다시 검토하고 싶어요.","「〜そう」로 예상하는 변화와 계획 수정의 이유를 말해요."],[4,"서비스·생활시설","避難(ひなん)|場所(ばしょ)|を|確認(かくにん)|したい|の|です|が、|地図(ちず)|は|あります|か。","대피 장소를 확인하고 싶은데 지도가 있나요?","대피 관련 위치를 알아둘 때 사용하는 질문이에요."],[4,"기술·디지털","画面(がめん)|に|エラー|が|出(で)て、|先(さき)|に|進(すす)めません。","화면에 오류가 떠서 다음으로 진행할 수 없어요.","오류가 나타나는 위치와 막힌 행동을 함께 말해요."],[4,"기술·디지털","再起動(さいきどう)|して|も、|同(おな)じ|問題(もんだい)|が|起(お)きます。","재시작해도 같은 문제가 발생해요.","이미 시도한 방법을 알려 중복 안내를 줄여요."],[4,"기술·디지털","どの|操作(そうさ)|を|した|後(あと)|に、|動(うご)かなく|なりました|か。","어떤 조작을 한 뒤에 작동하지 않게 됐나요?","문제 발생 직전의 행동을 확인하는 질문이에요."],[4,"기술·디지털","表示(ひょうじ)|されて|いる|文章(ぶんしょう)|を、|そのまま|お伝(つた)え|します。","표시된 문구를 그대로 말씀드릴게요.","「そのまま」는 바꾸지 않은 원래 상태를 뜻해요."],[4,"기술·디지털","写真(しゃしん)|を|送(おく)れば、|状態(じょうたい)|を|確認(かくにん)|して|いただけます|か。","사진을 보내면 상태를 확인해 주실 수 있나요?","말로 설명하기 어려운 문제를 보여 줄 방법을 제안해요."],[4,"서비스·생활시설","担当(たんとう)|の|方(かた)|が|戻(もど)られたら、|折(お)り返(かえ)し|お電話(でんわ)|を|いただけます|か。","담당자분이 돌아오시면 다시 전화해 주실 수 있나요?","「折り返し」는 연락을 받은 뒤 다시 연락하는 것을 뜻해요."],[4,"서비스·생활시설","念(ねん)|の|ため、|今日(きょう)|決(き)まった|内容(ないよう)|を|メール|で|送(おく)って|ください。","혹시 모르니 오늘 정한 내용을 메일로 보내 주세요.","합의한 내용을 글로 남겨 서로 확인해요."],[4,"서비스·생활시설","急(きゅう)な|変更(へんこう)|に|も|対応(たいおう)|して|いただき、|ありがとう|ございました。","갑작스러운 변경에도 대응해 주셔서 감사했습니다.","구체적으로 어떤 도움을 받았는지 밝히며 감사해요."],[4,"곤란한 상황","おかげさ|まで、|無事(ぶじ)|に|手続(てつづ)き|が|終(お)わりました。","덕분에 무사히 수속을 마쳤어요.","「おかげさまで」로 상대 도움 덕분의 좋은 결과를 전해요."],[4,"곤란한 상황","まだ|解決(かいけつ)|して|いない|ので、|次(つぎ)に|できる|こと|を|教(おし)えて|ください。","아직 해결되지 않아서 다음에 할 수 있는 일을 알려 주세요.","문제가 남았음을 명확히 하고 다음 조치를 요청해요."],[5,"생각·의견","その|点(てん)|に|は|賛成(さんせい)|です|が、|進(すす)め方(かた)|は|少(すこ)し|変(か)えたい|です。","그 점에는 찬성하지만 진행 방식은 조금 바꾸고 싶어요.","찬성하는 부분과 조정하고 싶은 부분을 나누어 말하면 의견 차이를 구체적으로 설명할 수 있어요."],[5,"생각·의견","今(いま)|ある|情報(じょうほう)|だけ|で|決(き)める|の|は、|少(すこ)し|早(はや)い|気(き)|が|します。","지금 있는 정보만으로 결정하기에는 조금 이른 것 같아요.","「〜気がします」로 단정하지 않고 조심스럽게 자신의 판단을 전해요."],[5,"생각·의견","私(わたし)|の|経験(けいけん)|で|は|そう|でした|が、|誰(だれ)|に|でも|当(あ)てはまる|と|は|限(かぎ)りません。","제 경험으로는 그랬지만 누구에게나 해당하는 것은 아니에요.","「〜とは限りません」은 항상 그렇지는 않다는 뜻이에요. 개인 경험의 범위를 밝혀요."],[5,"생각·의견","便利(べんり)|か|どう|か|より、|無理(むり)|なく|続(つづ)けられる|か|を|重視(じゅうし)|して|います。","편리한지보다 무리 없이 계속할 수 있는지를 중요하게 생각해요.","「Aかどうかより、Bか」로 판단 기준을 비교해 설명해요."],[5,"생각·의견","逆(ぎゃく)|の|立場(たちば)|だったら、|どう|感(かん)じる|と|思(おも)います|か。","반대 입장이었다면 어떻게 느낄 것 같으세요?","상대의 관점을 넓히는 질문이에요. 따지는 듯한 말투보다 차분한 어조로 말해 보세요."],[5,"생각·의견","反対(はんたい)|と|いう|より、|まだ|納得(なっとく)|できて|いない|ん|です。","반대한다기보다 아직 납득하지 못한 거예요.","「AというよりB」로 상대가 이해한 표현을 더 정확한 표현으로 고쳐요."],[5,"생각·의견","長(なが)い|目(め)|で|見(み)る|と、|その|方法(ほうほう)|の|ほう|が|負担(ふたん)|は|少(すく)なそう|です。","장기적으로 보면 그 방법이 부담은 더 적을 것 같아요.","「長い目で見ると」는 당장의 결과보다 장기적인 영향을 생각할 때 써요."],[5,"생각·의견","そう|考(かんが)える|よう|に|なった|きっかけ|は|何(なん)|です|か。","그렇게 생각하게 된 계기는 무엇인가요?","의견의 옳고 그름을 바로 판단하기보다 그 생각이 생긴 경험을 물어봐요."],[5,"생각·의견","条件(じょうけん)|が|変(か)われば、|私(わたし)|の|意見(いけん)|も|変(か)わる|かも|しれません。","조건이 달라지면 제 의견도 달라질 수 있어요.","「〜ば」와 「〜かもしれません」으로 조건에 따라 달라질 가능성을 표현해요."],[5,"생각·의견","一(ひと)つ|の|例(れい)|だけ|で、|全体(ぜんたい)|を|判断(はんだん)|しない|ほう|が|いい|と|思(おも)います。","한 가지 예만으로 전체를 판단하지 않는 편이 좋다고 생각해요.","「〜ないほうがいい」는 하지 않는 편이 좋다는 조언이에요. 의견임을 덧붙여 부드럽게 말해요."],[5,"생각·의견","大切(たいせつ)|に|して|いる|こと|は|同(おな)じ|で、|方法(ほうほう)|が|違(ちが)う|だけ|かも|しれません|ね。","중요하게 생각하는 것은 같고 방법만 다른 것일지도 모르겠네요.","서로 다른 주장 속에서 공통된 목표를 찾아 대화를 이어 가는 표현이에요."],[5,"생각·의견","ひとまず|結論(けつろん)|を|出(だ)さず|に、|持(も)ち帰(かえ)って|考(かんが)えて|も|いい|です|か。","일단 결론을 내리지 않고 돌아가서 생각해 봐도 될까요?","「持ち帰って考える」는 즉답하지 않고 나중에 검토한다는 뜻으로 회의에서도 써요."],[5,"친구·관계","聞(き)いて|ほしい|だけ|な|ので、|今(いま)|は|アドバイス|が|なくて|も|大丈夫(だいじょうぶ)|です。","들어주셨으면 할 뿐이라 지금은 조언을 안 해 주셔도 괜찮아요.","대화에서 자신이 원하는 도움의 방식을 정중하고 구체적으로 알려 주세요."],[5,"친구·관계","悪気(わるぎ)|が|なかった|の|は|分(わ)かります|が、|少(すこ)し|悲(かな)しかった|です。","나쁜 뜻이 없었다는 건 알지만 조금 슬펐어요.","상대의 의도와 자신의 감정을 나눠 말하면 비난을 줄이며 마음을 전할 수 있어요."],[5,"친구·관계","無理(むり)|に|話(はな)さなくて|も|いい|ので、|話(はな)したく|なったら|聞(き)かせて|ください。","억지로 말하지 않아도 괜찮으니 이야기하고 싶어지면 들려주세요.","「〜なくてもいい」로 부담을 덜어 주고, 상대가 말할 시기를 선택하게 해요."],[5,"친구·관계","近(ちか)い|関係(かんけい)|だ|から|こそ、|言葉(ことば)|に|して|伝(つた)える|こと|が|大事(だいじ)|です|ね。","가까운 사이이기 때문에 더더욱 말로 전하는 것이 중요하네요.","「〜からこそ」는 바로 그 이유 때문에 더욱 그렇다는 강조예요."],[5,"친구·관계","私(わたし)|が|手伝(てつだ)う|こと|で、|かえって|負担(ふたん)|に|なって|いません|か。","제가 돕는 것이 오히려 부담이 되고 있지는 않나요?","도움이 실제로 원하는 방식인지 확인해요. 「かえって」는 예상과 반대 결과를 나타내요."],[5,"친구·관계","その|話(はなし)|は|二人(ふたり)|の|間(あいだ)|だけ|に|して|もらえる|と|安心(あんしん)|です。","그 이야기는 우리 둘만 알고 있어 주시면 마음이 놓이겠어요.","사적인 이야기를 다른 사람에게 전하지 말아 달라고 부드럽게 부탁해요."],[5,"친구·관계","返事(へんじ)|が|遅(おそ)くて|も、|気(き)|に|して|いない|わけ|で|は|ない|ん|です。","답장이 늦더라도 신경 쓰지 않는 것은 아니에요.","「〜わけではない」는 상대가 추측한 의미를 부분적으로 부정할 때 써요."],[5,"친구·관계","お互(たが)い|に|無理(むり)|を|しない|距離感(きょりかん)|を|見(み)つけたい|です。","서로 무리하지 않는 거리감을 찾고 싶어요.","연락 빈도나 만나는 횟수를 이야기하며 서로 편한 관계를 제안할 수 있어요."],[5,"친구·관계","言(い)い方(かた)|が|きつく|なって|しまいました。|伝(つた)えたかった|の|は|別(べつ)|の|こと|です。","말투가 날카로워져 버렸어요. 전하고 싶었던 것은 다른 내용이에요.","자신의 말투를 인정한 뒤 의도를 다시 설명해요. 이어서 실제로 하고 싶었던 말을 덧붙여 보세요."],[5,"친구·관계","考(かんが)え方(かた)|は|違(ちが)います|が、|これから|も|話(はな)し合(あ)える|関係(かんけい)|で|いたい|です。","생각은 다르지만 앞으로도 대화할 수 있는 사이로 지내고 싶어요.","의견 차이를 인정하면서 관계를 이어 가고 싶은 마음을 전해요."],[5,"직장·업무","今(いま)|の|人数(にんずう)|で|進(すす)めるなら、|作業(さぎょう)|の|範囲(はんい)|を|絞(しぼ)る|必要(ひつよう)|が|あります。","지금 인원으로 진행한다면 작업 범위를 줄일 필요가 있어요.","「〜なら」로 조건을 밝히고 그 조건에서 필요한 조치를 제안해요."],[5,"직장·업무","急(いそ)ぎ|の|仕事(しごと)|が|重(かさ)なって|いる|ので、|優先(ゆうせん)|順位(じゅんい)|を|相談(そうだん)|させて|ください。","급한 일이 겹쳐 있어서 우선순위를 상의하게 해 주세요.","혼자 무리해서 처리하기보다 업무 순서를 함께 정해 달라고 요청하는 표현이에요."],[5,"직장·업무","誰(だれ)|か|一人(ひとり)|が|頑張(がんば)り|続(つづ)ける|仕組(しく)み|に|は|したくない|です。","누군가 한 사람이 계속 애써야 하는 구조로 만들고 싶지는 않아요.","「〜続ける」는 동작의 지속이에요. 팀 운영이나 역할 분담에 대한 생각을 말할 수 있어요."],[5,"직장·업무","結果(けっか)|だけ|を|見(み)る|と|失敗(しっぱい)|です|が、|次(つぎ)に|使(つか)える|経験(けいけん)|に|なりました。","결과만 보면 실패지만 다음에 활용할 수 있는 경험이 되었 /* ============================================================
   3. 텍스트 처리 (후리가나 · 한글 발음)
   ============================================================ */
const PARTICLES=new Set(['は','が','を','に','で','へ','と','も','の','か','から','まで','よ','ね','な','より','けど','だけ','でも','なら','し']);
const KANJI_RE=/([一-鿿々〆ヶ]+)\(([ぁ-ゟ]+)\)/g;
function parseTok(raw){
  let punct='';const m=raw.match(/[、。！？!?…]+$/);
  if(m){punct=m[0];raw=raw.slice(0,-punct.length)}
  return {surf:raw.replace(KANJI_RE,'$1'),read:raw.replace(KANJI_RE,'$2'),ruby:raw.replace(KANJI_RE,'<ruby>$1<rt>$2</rt></ruby>'),punct};
}
function parseLine(s){
  const toks=s.split('|').map(parseTok);
  const j=f=>toks.map(t=>f(t)+t.punct).join('');
  return {toks,surf:j(t=>t.surf),read:j(t=>t.read),ruby:j(t=>t.ruby),bare:toks.map(t=>t.surf).join('')};
}
// 바꿔 말하기 사전 키: 구두점·기호를 뺀 표면형
const altKey=line=>line.surf.replace(/[、。！？!?…「」\s]/g,'');
const HMAP={};
[...HIRA,...DAKU,...YOON].forEach(([k,r])=>HMAP[k]=r);
Object.assign(HMAP,{'ぁ':'아','ぃ':'이','ぅ':'우','ぇ':'에','ぉ':'오','ゃ':'야','ゅ':'유','ょ':'요','ゔ':'부','ちゃ':'차','ちゅ':'추','ちょ':'초',
  'ふぁ':'파','ふぃ':'피','ふぇ':'페','ふぉ':'포','てぃ':'티','でぃ':'디','とぅ':'투','うぃ':'위','うぇ':'웨','うぉ':'워','ちぇ':'체','しぇ':'셰','じぇ':'제'});
const H_EXC={'こんにちは':'콘니치와','こんばんは':'콘반와','では':'데와'};
function addJong(s,j){if(!s)return null;const c=s.charCodeAt(s.length-1);if(c<0xAC00||c>0xD7A3||(c-0xAC00)%28)return null;return s.slice(0,-1)+String.fromCharCode(c+j)}
function vowelOf(s){if(!s)return -1;const c=s.charCodeAt(s.length-1)-0xAC00;return c<0||c>11171?-1:Math.floor((c%588)/28)}
function kanaToHangul(src){
  if(H_EXC[src])return H_EXC[src];
  const s=toHira(src);let o='',i=0;
  while(i<s.length){
    const two=s.substr(i,2),one=s[i];
    if(two.length===2&&HMAP[two]){o+=HMAP[two];i+=2;continue}
    if(one==='っ'){o=addJong(o,19)??o;i++;continue}
    if(one==='ん'){o=addJong(o,4)??(o+'응');i++;continue}
    if(one==='ー'){o+='-';i++;continue}
    if(one==='う'&&[8,12,13,17,18].includes(vowelOf(o))){o+='-';i++;continue}
    o+=HMAP[one]||one;i++;
  }
  return o;
}
const ATTACH=/^(です|でし|ま[すしせ]|ください|か$|ね|よ|って|た$|だ|てる|ん)/;
function hangul(line){
  let o='';
  line.toks.forEach((t,i)=>{
    const h=i>0&&t.surf==='は'?'와':i>0&&t.surf==='へ'?'에':kanaToHangul(t.read);
    const glue=i>0&&(PARTICLES.has(t.surf)||ATTACH.test(t.read));
    o+=(i===0||glue?'':' ')+h+t.punct.replace(/、/g,',').replace(/。/g,'.').replace(/！/g,'!').replace(/？/g,'?');
  });
  return o;
}

const ITEMS=[],BY_ID={},LESSONS=[],LESSON_BY_ID={};
{
  let order=0;
  for(const C of COURSES)for(const L of C.lessons){
    L.course=C.id;L.items=[];LESSONS.push(L);LESSON_BY_ID[L.id]=L;
    // 각 대사: 기본 표현 + 바꿔 말하기(줄 고유 + 공통 사전) → versions
    const parseDialog=d=>(d||[]).map(([role,jp,ko,alts])=>{
      const line=parseLine(jp),base={raw:jp,line,ko};
      const extra=[...(alts||[]),...altsFor(line)].map(([j,k])=>({raw:j,line:parseLine(j),ko:k}));
      const versions=[base,...extra].filter((v,i,a)=>a.findIndex(x=>altKey(x.line)===altKey(v.line))===i);
      return {role,line,ko,raw:jp,versions};
    });
    L.lines=parseDialog(L.dialog);
    // 장면별 대화 변형: 0번은 기본 대화, 이후는 more
    L.variants=L.dialog?[{title:'기본 대화',roles:L.roles,raw:L.dialog,lines:L.lines},
      ...(L.more||[]).map(m=>({title:m.title,roles:{...L.roles,...m.roles},raw:m.dialog,lines:parseDialog(m.dialog)}))]:[];
    L.allLines=L.variants.flatMap(v=>v.lines);
    const add=it=>{if(BY_ID[it.id])return;it.lesson=L.id;it.course=C.id;it.order=order++;ITEMS.push(it);BY_ID[it.id]=it;L.items.push(it)};
    (L.kana||[]).forEach(([k,r,alt])=>add({id:'k:'+k,kind:'kana',k,r,alt:alt||[],kata:/[゠-ヿ]/.test(k)}));
    (L.words||[]).forEach(([jp,ko,ex,exKo])=>{const line=parseLine(jp),id='w:'+line.surf;
      if(BY_ID[id]){if(ex&&!BY_ID[id].ex){BY_ID[id].ex=parseLine(ex);BY_ID[id].exKo=exKo}return}
      const it={id,kind:'word',line,ko};if(ex){it.ex=parseLine(ex);it.exKo=exKo}add(it)});
    (L.phrases||[]).forEach(([jp,ko,note])=>{const line=parseLine(jp),id='p:'+line.surf;
      if(BY_ID[id]){if(note&&!BY_ID[id].note)BY_ID[id].note=note;return}
      const it={id,kind:'phrase',line,ko};if(note)it.note=note;add(it)});
  }
}
// 중복 정리 후 남은 항목·대화가 하나도 없는 레슨은 목록에서 뺌 (항목은 이미 앞 레슨에 들어 있음)

for(let i=LESSONS.length-1;i>=0;i--){const L=LESSONS[i];if(!L.items.length&&!L.variants.length){delete LESSON_BY_ID[L.id];LESSONS.splice(i,1)}}

   6. 간격 반복 (SRS)
   - 새 항목: 소개 → 같은 세션에서 2번 맞혀야 졸업 → 1일 뒤
   - 복습: 정답이면 간격 × 쉬움 계수, 틀리면 간격 축소 + 세션 안에서 재학습
   - 항목마다 맞힌 횟수(reps)에 따라 문제 난이도가 올라감
   ============================================================ */
function bucket(id){const c=DB.cards[id];if(!c)return 'new';if(c.s!=='review')return 'learn';return c.ivl>=14?'mature':'young'}
const BUCKET_LABEL={new:'새 항목',learn:'학습 중',young:'익히는 중',mature:'숙지'};
function introduce(it){
  if(DB.cards[it.id])return;
  DB.cards[it.id]={s:'learn',step:0,due:Date.now(),ivl:0,ease:2.5,reps:0,lapses:0,intro:Date.now(),last:0,ok:0,ng:0};
  today().new++;save();
}
function grade(it,g,practice){ // g: again | hard | good
  const c=DB.cards[it.id],now=Date.now(),t=today();
  c.last=now;t.n++;
  if(g==='again')c.ng++;else{c.ok++;t.ok++}
  let res='done';
  if(practice&&c.s==='review'&&c.due>now){
    if(g==='again'){c.lapses++;c.ease=Math.max(1.3,c.ease-.15);c.ivl=Math.max(1,Math.round(c.ivl*.5));c.due=dayStart()+DAY}
    else c.reps++;
  }else if(c.s!=='review'){
    if(g==='again'){c.step=0;res='requeue'}
    else{
      c.reps++;c.step++;
      if(g==='easy'){c.s='review';c.ivl=Math.max(3,c.ivl);c.ease=Math.min(3,c.ease+.15);c.due=dayStart()+c.ivl*DAY}
      else if(c.step>=(c.lapses>0?1:2)){c.s='review';c.ivl=Math.max(1,c.ivl);c.due=dayStart()+c.ivl*DAY}
      else res='step';
    }
  }else{
    if(g==='again'){c.lapses++;c.ease=Math.max(1.3,c.ease-.2);c.ivl=Math.max(1,Math.round(c.ivl*.4));c.s='learn';c.step=0;c.due=now;res='requeue'}
    else{
      c.reps++;
      let ivl=g==='hard'?Math.max(c.ivl+1,Math.round(c.ivl*1.2)):g==='easy'?Math.max(c.ivl+2,Math.round(c.ivl*c.ease*1.3)):Math.max(c.ivl+1,Math.round(c.ivl*c.ease));
      if(g==='easy')c.ease=Math.min(3,c.ease+.15);
      if(g==='hard')c.ease=Math.max(1.3,c.ease-.15);
      if(ivl>4)ivl=Math.round(ivl*(.95+Math.random()*.1));
      c.ivl=Math.min(ivl,365);c.due=dayStart()+c.ivl*DAY;
    }
  }
  save();return res;
}

const synth=window.speechSynthesis;let jaVoice=null;
function pickVoice(){if(!synth)return;const v=synth.getVoices();jaVoice=v.find(x=>x.lang==='ja-JP'&&/google|natural|online/i.test(x.name))||v.find(x=>x.lang==='ja-JP')||v.find(x=>/^ja/i.test(x.lang))||null}

// 가장 최근에 요청한 소리만 재생: 이전 요청·예약은 모두 무효
let speakGen=0;
function speak(text,rate){
  const gen=++speakGen;
  return new Promise(res=>{
    if(!synth||!text)return res();
    const busy=synth.speaking||synth.pending;
    synth.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=rate||DB.settings.rate;
    if(!jaVoice)pickVoice();if(jaVoice)u.voice=jaVoice;
    let done=false;const fin=()=>{if(!done){done=true;res()}};
    u.onend=fin;u.onerror=fin;setTimeout(fin,Math.max(2500,text.length*400));
    // cancel 직후 바로 speak하면 일부 브라우저(안드로이드 Chrome)에서 소리가 꼬이거나 빠져서 잠깐 쉬고 재생
    setTimeout(()=>{if(gen!==speakGen)return fin();synth.speak(u)},busy?80:0);
  });
}
function stopSpeech(){speakGen++;synth?.cancel()}
// 화면이 바뀐 뒤 늦게 도착한 자동 재생 예약은 버림
let sayEpoch=0;

/* 음성 엔진에 넘길 텍스트
   한자를 그대로 넘기면 엔진이 읽는 법을 추측해요. 一(いち)→ひと, 四(よん)→し, 百(ひゃく)→もも,
   十分(じゅっぷん)→じゅうぶん, 一日(いちにち)→ついたち처럼 화면 후리가나와 달라질 수 있어서,
   단어와 헷갈리기 쉬운 조각은 화면에 보이는 읽기(가나)로 읽힙니다. */
const SPEAK_BY_READING=/[〇一二三四五六七八九十百千万億何]/;
const AMBIG_WORDS=new Set(['今日','明日','昨日','一日','一人','二人','大人','上手','下手','十分','今','方','日','月','人','後','間','上','下','中','前','生']);
const hasKanji=s=>/[一-鿿々]/.test(s);
function speechOf(line,isWord){
  return line.toks.map(t=>{
    if(!hasKanji(t.surf))return t.surf+t.punct;
    const kanjiCount=(t.surf.match(/[一-鿿々]/g)||[]).length;
    const byReading=isWord||SPEAK_BY_READING.test(t.surf)||AMBIG_WORDS.has(t.surf)||kanjiCount===1&&t.surf.length<=2;
    return (byReading?t.read:t.surf)+t.punct;
  }).join('');
}
const sayOf=it=>it.kind==='kana'?it.k:speechOf(it.line,it.kind==='word');
const sayLine=line=>speechOf(line,false);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let activeRecognition=null;
function recognize(){
  return new Promise((res,rej)=>{
    const r=new SR();activeRecognition=r;r.lang='ja-JP';r.interimResults=false;r.maxAlternatives=5;
    let got=false;
    r.onresult=e=>{got=true;res([...e.results[0]].map(a=>a.transcript))};
    r.onerror=e=>{if(!got)rej(e.error)};
    r.onend=()=>{if(activeRecognition===r)activeRecognition=null;if(!got)res([])};
    r.start();
  });
}
const norm=s=>toHira(s).replace(/[\s、。！？!?…,.・「」ー〜~]/g,'');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const sim=(a,b)=>{a=norm(a);b=norm(b);if(!a||!b)return 0;return 1-lev(a,b)/Math.max(a.length,b.length)};
function speechScore(alts,line){return Math.max(0,...alts.map(a=>Math.max(sim(a,line.surf),sim(a,line.read))))}

function relDue(c){
  if(!c)return '';
  const d=Math.round((dayStart(c.due)-dayStart())/DAY);
  if(c.due<=Date.now())return '복습할 때';
  return d<=0?'오늘':d===1?'내일':d<30?`${d}일 후`:`${Math.round(d/30)}달 후`;
}

function drawBook(){
  const kinds=[['all','전체'],['word','단어'],['phrase','표현'],['kana','가나'],['ai','📝 회화 노트']];
  const bs=[['all','모든 상태'],['learn','학습 중'],['young','익히는 중'],['mature','숙지'],['new','새 항목']];
  $('#bookKinds').innerHTML=kinds.map(([k,l])=>`<button class="${bookKind===k?'on':''}" data-k="${k}">${l}</button>`).join('');
  $('#bookBuckets').innerHTML=bs.map(([k,l])=>`<button class="${bookB===k?'on':''}" data-b="${k}">${l}</button>`).join('');
  document.querySelectorAll('#bookKinds button').forEach(b=>b.onclick=()=>{bookKind=b.dataset.k;drawBook()});
  document.querySelectorAll('#bookBuckets button').forEach(b=>b.onclick=()=>{bookB=b.dataset.b;drawBook()});
  const q=bookQ.trim().toLowerCase();
  const match=it=>{
    if(bookKind==='ai'?it.source!=='ai'&&!DB.practiceNotes.includes(it.id):bookKind!=='all'&&it.kind!==bookKind)return false;
    if(bookB!=='all'&&bucket(it.id)!==bookB)return false;
    if(!q)return true;
    const hay=it.kind==='kana'?it.k+toHira(it.k)+it.r:it.line.surf+it.line.read+it.ko;
    return hay.toLowerCase().includes(q)||toHira(hay).includes(toHira(q));
  };
  let html='',count=0;
  for(const L of [AI_LESSON,...LESSONS]){
    const items=L.items.filter(match);if(!items.length)continue;count+=items.length;
    html+=`<div class="group-t">${L.icon} ${L.title}</div><ul class="wl">${items.map(it=>{
      const b=bucket(it.id),c=DB.cards[it.id];
      return `<li data-id="${it.id}"><div class="m"><div class="jp">${itemJP(it)}</div>${it.kind==='kana'?'':pronHTML(it.line)}<div class="ko">${itemKO(it)}</div>${it.ex?`<div class="ex-mini"><span class="jp">${it.ex.ruby}</span><span class="ko">${it.exKo||''}</span></div>`:it.note&&it.source!=='ai'?`<div class="ex-mini"><span class="ko">💡 ${it.note}</span></div>`:''}</div><div class="r"><span class="pill ${b}">${BUCKET_LABEL[b]}</span><br>${c&&c.s==='review'?relDue(c):''}</div></li>`;
    }).join('')}</ul>`;
  }
  const listed=[...new Map([AI_LESSON,...LESSONS].flatMap(L=>L.items.filter(match)).map(x=>[x.id,x])).values()];
  $('#bookList').innerHTML=count?`<button class="btn btn-primary btn-block" id="bookPractice" style="margin:12px 0 4px">🔁 이 목록에서 연습하기 · ${Math.min(10,listed.length)}개</button><p class="fine" style="margin:0 2px 4px">검색·필터로 좁힌 항목 중 복습이 급한 것부터 최대 10개를 골라요.</p>`+html:'<div class="empty">조건에 맞는 항목이 없어요.</div>';
  if($('#bookPractice'))$('#bookPractice').onclick=()=>{
    const now=Date.now(),score=x=>{const c=DB.cards[x.id];return !c?1:c.due<=now?0:2+c.ivl/100};
    const pick=shuffle(listed).sort((a,b)=>score(a)-score(b)).slice(0,10);
    startSession({practice:pick.map(item=>({item,t:DB.cards[item.id]?'ex':'intro'})),title:'선택한 표현 연습'});
  };
  document.querySelectorAll('#bookList [data-id]').forEach(li=>li.onclick=()=>speak(sayOf(BY_ID[li.dataset.id])));
}

let LS=null;

  const L=LESSON_BY_ID[id];LS={L,tab:L.lines.length?'dialog':L.kana?'kana':'words',hideKo:false,v:0};

function drawLesson(){
  const {L}=LS,p=lessonProgress(L);
  const tabs=L.kana?[['kana','글자'],['words','읽기 단어'],['tip','팁']]:L.lines.length?[['dialog','대화'],['phrases','표현'],['words','단어'],['tip','팁']]:[['words','단어'],['phrases','문장'],['tip','팁']];
  let body='';
  const V=L.variants?.[LS.v]||{lines:L.lines,roles:L.roles};
  if(LS.tab==='dialog'){
    body=`${(L.variants||[]).length>1?`<div class="seg" style="margin-top:0">${L.variants.map((v,i)=>`<button class="${LS.v===i?'on':''}" data-v="${i}">${i+1}. ${esc(v.title)}</button>`).join('')}</div>`:''}
      <div class="tool-row"><button class="btn btn-ghost" id="playAll">▶ 대화 전체 듣기</button><button class="btn btn-ghost" id="toggleKo">${LS.hideKo?'해석 보기':'해석 숨기기'}</button></div>
      <div class="chat ${LS.hideKo?'hide-ko':''}">${V.lines.map((ln,i)=>`<div class="msg ${ln.role==='M'?'me':''}"><div class="who">${ln.role==='M'?'나':V.roles[ln.role]}</div><div class="bubble" data-i="${i}">${jpHTML(ln.line)}${pronHTML(ln.line)}<div class="ko">${ln.ko}</div>${altListHTML(ln)}</div></div>`).join('')}</div>`;
  }else if(LS.tab==='kana'){
    const ks=L.items.filter(x=>x.kind==='kana');
    body=`<div class="kgrid">${ks.map(it=>`<div class="kcell ${it.k.length>1?'wide':''}" data-id="${it.id}"><b>${it.k}</b><span>${it.r}</span></div>`).join('')}</div>`;
  }else if(LS.tab==='tip'){
    body=`<div class="tip">💡 ${L.tip}</div>`;

let playToken=0;
function stopPlay(){playToken++;stopSpeech();document.querySelectorAll('.bubble.playing').forEach(b=>b.classList.remove('playing'))}
async function playDialog(L){
  stopPlay();const tok=playToken;
  for(let i=0;i<L.lines.length;i++){
    if(tok!==playToken)return;
    const b=document.querySelector(`#lsBody .bubble[data-i="${i}"]`);
    document.querySelectorAll('.bubble.playing').forEach(x=>x.classList.remove('playing'));
    if(b){b.classList.add('playing');b.scrollIntoView({block:'nearest',behavior:'smooth'})}
    await speak(sayLine(L.lines[i].line));
    await new Promise(r=>setTimeout(r,350));

   11. 학습 세션
   ============================================================ */
let S=null;
function startSession({reviews=[],news=[],practice=null,title='학습',lesson=null}){
  let queue;
  if(practice){queue=practice}
  else{
    queue=[];const r=shuffle(reviews);let ri=0;
    news.forEach(n=>{queue.push({item:n,t:'intro'});for(let k=0;k<2&&ri<r.length;k++)queue.push({item:r[ri++],t:'ex'})});
    while(ri<r.length)queue.push({item:r[ri++],t:'ex'});
  }
  if(!queue.length){toast('지금은 학습할 항목이 없어요');return}
  S={queue,idx:0,practice:!!practice,title,lesson,answered:false,correct:0,answers:0,newCount:0,wrong:[],start:Date.now()};
  $('#sx').classList.add('open');
  renderTask();
}
function insertTask(task,offset){S.queue.splice(Math.min(S.queue.length,S.idx+1+offset),0,task)}
function setProg(){$('#sxProg').style.width=`${S.idx/S.queue.length*100}%`}
function primary(label,fn,disabled=false){
  const b=$('#sxPrimary');b.textContent=label;b.disabled=disabled;b.onclick=fn;$('#sxFoot').style.display='';
}
function hideFoot(){$('#sxFoot').style.display='none'}
function renderTask(){
  sayEpoch++;hideFeedback();S.answered=false;setProg();
  const task=S.queue[S.idx],it=task.item;
  $("#sx .ov-body").scrollTop=0;
  if(task.t==='intro')return renderIntro(it);
  const type=task.type||exerciseFor(it);
  S.cur={task,type,it};
  EX[type](it);
}
function exerciseFor(it){
  const c=DB.cards[it.id],r=c?c.reps:0,sp=DB.settings.speaking?1:0;
  if(it.kind==='kana'){if(r<1)return 'kanaRead';if(r<2)return 'kanaPick';return pickW({kanaType:3,kanaListen:2,kanaRead:1})}
  if(it.kind==='word'){if(r<1)return 'mean';if(r<2)return 'listen';if(r<3)return 'recall';return pickW({recall:2,listen:2,mean:1,speak:2*sp})}
  const n=it.line.toks.length;
  if(r<1)return 'mean';if(r<2)return 'listen';if(r<3)return n>=3?'build':'recall';
  return pickW({build:n>=3?2:0,dictation:n>=3?2:0,cloze:n>=2?2:0,recall:1,listen:1,speak:3*sp});
}

/* 보기 생성 */
function similar(it,n,keyFn,filter){
  const len=x=>x.kind==='kana'?x.k.length:x.line.bare.length;
  const pool=ITEMS.filter(x=>x.kind===it.kind&&x.id!==it.id&&(!filter||filter(x)));
  const scored=pool.map(x=>({x,s:Math.abs(x.order-it.order)/60+(DB.cards[x.id]?0:.4)+Math.random()*1.4+Math.abs(len(x)-len(it))/6}));
  scored.sort((a,b)=>a.s-b.s);
  const seen=new Set([keyFn(it)]),out=[];
  for(const {x} of scored){const k=keyFn(x);if(seen.has(k))continue;seen.add(k);out.push(x);if(out.length>=n)break}
  return out;
}
function choices(opts,labelFn,correct,cls='',two=false){
  return `<div class="opts ${two?'two':''}">${opts.map((o,i)=>`<button class="opt ${cls}" data-ok="${o===correct}"><span class="k">${i+1}</span><span>${labelFn(o)}</span></button>`).join('')}</div>`;
}
function bindChoices(onPick){
  document.querySelectorAll('#sxBody .opt').forEach(b=>b.onclick=()=>{
    if(S.answered)return;
    const ok=b.dataset.ok==='true';
    document.querySelectorAll('#sxBody .opt').forEach(x=>{x.disabled=true;if(x.dataset.ok==='true')x.classList.add('correct');else if(x!==b)x.classList.add('dim')});
    if(!ok)b.classList.add('wrong');
    onPick?onPick(ok,b):submit(ok);
  });
  hideFoot();
}
const head=(tag,prompt)=>`<div class="ex-tag">${tag}</div><div class="ex-prompt">${prompt}</div>`;
const audioRow=it=>`<div class="audio-row"><button class="audio" data-say="1">🔊 듣기</button><button class="audio" data-say=".6">🐢 천천히</button></div>`;
function bindAudio(it){document.querySelectorAll('#sxBody [data-say]').forEach(b=>b.onclick=()=>speak(sayOf(it),+b.dataset.say===1?undefined:+b.dataset.say))}

const EX={
  /* 가나 */
  kanaRead(it){
    const opts=shuffle([it,...similar(it,3,x=>x.r,x=>x.kata===it.kata)]);
    $('#sxBody').innerHTML=`<div class="ex">${head('글자 읽기','이 글자는 어떻게 읽을까요?')}<div class="stage"><div class="big-kana">${it.k}</div></div>${choices(opts,x=>x.r,it,'',true)}</div>`;
    bindChoices();
  },
  kanaPick(it){
    const opts=shuffle([it,...similar(it,3,x=>x.r,x=>x.kata===it.kata)]);
    $('#sxBody').innerHTML=`<div class="ex">${head('글자 찾기','이 소리에 맞는 글자는?')}<div class="stage"><div class="big-hangul">${it.r}</div>${audioRow(it)}</div>${choices(opts,x=>x.k,it,'kana',true)}</div>`;
    bindAudio(it);bindChoices();
    if(DB.settings.autoplay)speak(it.k);
  },
  kanaListen(it){
    const opts=shuffle([it,...similar(it,3,x=>x.r,x=>x.kata===it.kata)]);
    $('#sxBody').innerHTML=`<div class="ex">${head('듣고 고르기','들리는 글자를 고르세요')}<div class="stage"><button class="big-audio" data-say="1">🔊</button></div>${choices(opts,x=>x.k,it,'kana',true)}</div>`;
    bindAudio(it);bindChoices();autoSay(it.k,250);
  },
  kanaType(it){
    $('#sxBody').innerHTML=`<div class="ex">${head('직접 입력','한글로 발음을 적어 보세요')}<div class="stage"><div class="big-kana">${it.k}</div></div><input class="type-in" id="typeIn" autocomplete="off" placeholder="예: 카"></div>`;
    const inp=$('#typeIn');setTimeout(()=>inp.focus(),80);
    const go=()=>{const v=inp.value.replace(/\s/g,'');if(!v||S.answered)return;const acc=[it.r,...it.alt];if(/[んン]/.test(it.k))acc.push('ㄴ','은','엔');const ok=acc.includes(v);inp.style.borderColor=ok?'var(--matcha)':'var(--shu)';inp.disabled=true;submit(ok,null,v)};
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();go()}};
    inp.oninput=()=>$('#sxPrimary').disabled=!inp.value.trim();
    primary('확인',go,true);
  },
  /* 단어·표현 */
  mean(it){
    const opts=shuffle([it,...similar(it,3,x=>x.ko)]);
    $('#sxBody').innerHTML=`<div class="ex">${head(it.kind==='word'?'뜻 고르기':'표현 이해','무슨 뜻일까요?')}<div class="stage">${jpHTML(it.line,it.kind==='word'?'big-word':'big-sent')}${pronHTML(it.line)}${audioRow(it)}</div>${choices(opts,x=>x.ko,it)}</div>`;
    bindAudio(it);bindChoices();
    if(DB.settings.autoplay)autoSay(sayOf(it),200);
  },
  listen(it){
    const opts=shuffle([it,...similar(it,3,x=>x.ko)]);
    $('#sxBody').innerHTML=`<div class="ex">${head('듣기','잘 듣고 뜻을 고르세요')}<div class="stage"><button class="big-audio" data-say="1">🔊</button><div class="audio-row"><button class="audio" data-say=".6">🐢 천천히</button></div></div>${choices(opts,x=>x.ko,it)}</div>`;
    bindAudio(it);bindChoices();autoSay(sayOf(it),250);
  },
  recall(it){
    const opts=shuffle([it,...similar(it,3,x=>x.line.surf)]);
    $('#sxBody').innerHTML=`<div class="ex">${head('일본어로','일본어로 어떻게 말할까요?')}<div class="stage"><div class="big-ko">${it.ko}</div></div>${choices(opts,x=>x.line.ruby,it,'jp-opt')}</div>`;
    bindChoices();
  },
  build(it,dict=false){
    const toks=it.line.toks.map((t,i)=>({...t,i}));
    let order=shuffle(toks);if(order.every((t,k)=>t.i===k))order.push(order.shift());
    // 비슷한 조각 하나를 섞어 난이도 추가
    const extra=TOKENS.filter(t=>!toks.some(x=>x.surf===t.surf)&&Math.abs(t.surf.length-2)<3);
    if(toks.length>=4&&extra.length){order.splice(Math.random()*order.length|0,0,{...extra[Math.random()*extra.length|0],i:-1})}
    S.build={order,picked:[]};
    $('#sxBody').innerHTML=`<div class="ex">${head(dict?'받아쓰기':'문장 만들기',dict?'들리는 문장을 조각으로 완성하세요':'일본어 문장을 만들어 보세요')}
      <div class="stage" style="padding:18px">${dict?`<button class="big-audio" data-say="1" style="width:72px;height:72px;font-size:28px">🔊</button><div class="audio-row"><button class="audio" data-say=".6">🐢 천천히</button></div>`:`<div class="big-ko" style="font-size:19px">${it.ko}</div>`}</div>
      <div class="answer-zone" id="zone"></div><div class="tiles" id="tiles"></div></div>`;
    if(dict){bindAudio(it);autoSay(sayOf(it),250)}
    const draw=()=>{
      const b=S.build;
      $('#zone').innerHTML=b.picked.map((k,n)=>`<button class="tile" data-n="${n}">${b.order[k].ruby}</button>`).join('');
      $('#tiles').innerHTML=b.order.map((t,k)=>`<button class="tile ${b.picked.includes(k)?'ghost':''}" data-k="${k}">${t.ruby}</button>`).join('');
      $('#sxPrimary').disabled=!b.picked.length;
      if(S.answered)return;
      document.querySelectorAll('#tiles [data-k]').forEach(x=>x.onclick=()=>{const k=+x.dataset.k;if(b.picked.includes(k))return;b.picked.push(k);draw()});
      document.querySelectorAll('#zone [data-n]').forEach(x=>x.onclick=()=>{b.picked.splice(+x.dataset.n,1);draw()});
    };
    primary('확인',()=>{
      if(S.answered)return;
      const b=S.build,mine=b.picked.map(k=>b.order[k].surf).join('');
      const ok=mine===it.line.toks.map(t=>t.surf).join('');
      $('#zone').style.borderColor=ok?'var(--matcha)':'var(--shu)';
      submit(ok,null,b.picked.map(k=>b.order[k].surf).join(' '));
    },true);
    draw();
  },
  dictation(it){EX.build(it,true)},
  cloze(it){
    const toks=it.line.toks,parts=toks.map((t,i)=>i).filter(i=>PARTICLES.has(toks[i].surf));
    const bi=parts.length&&Math.random()<.55?parts[Math.random()*parts.length|0]:Math.random()*toks.length|0;
    const ans=toks[bi],inS=new Set(toks.map(t=>t.surf));
    let pool;
    if(PARTICLES.has(ans.surf))pool=shuffle(['は','が','を','に','で','と','も','の','から','まで','へ'].filter(p=>!inS.has(p))).map(p=>({surf:p,ruby:p}));
    else{const c=TOKENS.filter(t=>!inS.has(t.surf));pool=[...shuffle(c.filter(t=>t.course===it.course)),...shuffle(c)]}
    const ds=[];const seen=new Set([ans.surf]);for(const t of pool){if(seen.has(t.surf))continue;seen.add(t.surf);ds.push(t);if(ds.length>=3)break}
    const opts=shuffle([ans,...ds]);
    const sent=f=>toks.map((t,i)=>i===bi?`<span class="blank ${f?'fill':''}">${f?t.ruby:'＿'}</span>${t.punct}`:t.ruby+t.punct).join('');
    $('#sxBody').innerHTML=`<div class="ex">${head('빈칸 채우기','빈칸에 들어갈 말은?')}<div class="stage"><div class="jp big-sent" id="clz">${sent(false)}</div><div class="ko" style="margin-top:8px">${it.ko}</div></div>${choices(opts,x=>x.ruby,ans,'jp-opt',true)}</div>`;
    bindChoices(ok=>{$('#clz').innerHTML=sent(true);submit(ok)});
  },
  speak(it){
    const canSR=!!SR;
    $('#sxBody').innerHTML=`<div class="ex">${head('말하기','일본어로 소리 내어 말해 보세요')}
      <div class="stage"><div class="big-ko">${it.ko}</div><div class="ko" style="font-size:12.5px;margin-top:8px">${it.kind==='phrase'?`${it.line.toks.length}개 조각으로 된 문장`:'단어'} · 힌트: <span class="jp">${it.line.read.slice(0,1)}…</span></div></div>
      ${canSR?`<button class="mic" id="mic">🎤</button><div class="heard" id="heard">버튼을 누르고 말하세요</div>`:`<div class="heard">먼저 소리 내어 말한 뒤 정답을 확인하세요</div>`}
      <div class="speak-alt"><button class="btn btn-ghost" id="reveal" style="padding:10px 14px;font-size:13px">정답 보기 (스스로 채점)</button></div></div>`;
    $('#reveal').onclick=()=>selfGrade(it);
    hideFoot();
    if(canSR){
      let tries=0;
      $('#mic').onclick=async()=>{
        if(S.answered)return;
        const mic=$('#mic');mic.classList.add('on');$('#heard').textContent='듣는 중…';
        try{
          const alts=await recognize();mic.classList.remove('on');
          if(!alts.length){$('#heard').textContent='소리가 들리지 않았어요. 다시 눌러 주세요';return}
          const sc=speechScore(alts,it.line);tries++;
          $('#heard').innerHTML=`들린 말: <b class="jp">${alts[0]}</b> · 일치도 ${Math.round(sc*100)}%`;
          if(sc>=.72)submit(true,sc>=.9?'good':'hard',alts[0]);
          else if(tries>=3)submit(false,null,alts[0]);
          else $('#heard').innerHTML+=`<br><span style="color:var(--shu)">조금 달라요. 한 번 더! (${tries}/3)</span>`;
        }catch(err){
          mic.classList.remove('on');
          $('#heard').textContent=err==='not-allowed'?'마이크 권한이 없어요. 정답 보기로 스스로 채점하세요':'음성 인식을 사용할 수 없어요. 정답 보기로 채점하세요';
        }
      };
    }
  }
};

/* 정답 처리 */
function submit(ok,g,mine){
  if(S.answered)return;S.answered=true;
  const it=S.cur.it;
  if(!DB.cards[it.id])introduce(it);
  const res=grade(it,g||(ok?'good':'again'),S.practice);
  S.answers++;if(ok)S.correct++;else S.wrong.push(it);
  if(res==='requeue')insertTask({item:it,t:'ex',type:S.cur.task.type},3);
  if(res==='step')insertTask({item:it,t:'ex'},5);
  showFeedback(ok,it,mine);
}
function answerBlock(it){
  return `<div class="ans"><button class="play" id="fbPlay">🔊</button><div class="jp">${it.kind==='kana'?`<span class="serif" style="font-size:30px">${it.k}</span> <b style="font-family:'Noto Sans KR'">${it.r}</b>`:it.line.ruby}</div>${it.kind==='kana'?'':pronHTML(it.line)+`<div class="ko">${it.ko}</div>`}${it.ex?`<div class="ex-mini"><span class="jp">${it.ex.ruby}</span><span class="ko">${it.exKo||''}</span></div>`:''}${it.note?`<div class="ko" style="font-size:12px;margin-top:4px">${it.source==='ai'?'📝':'💡'} ${it.note}</div>`:''}</div>`;
}
function showFeedback(ok,it,mine){
  const fb=$('#fb');fb.className='fb '+(ok?'ok':'ng');
  const praise=['좋아요!','정답!','완벽해요!','すごい！','その調子！'];
  $('#fbInner').innerHTML=`<h3>${ok?'✓ '+praise[Math.random()*praise.length|0]:'✕ 아쉬워요 — 이따 다시 나와요'}</h3>
    ${!ok&&mine?`<div class="mine">내 답: ${mine}</div>`:''}${answerBlock(it)}
    <button class="btn ${ok?'btn-primary':'btn-primary'} btn-block" id="fbNext" style="${ok?'background:var(--matcha);box-shadow:0 3px 0 color-mix(in srgb,var(--matcha) 70%,#000)':''}">계속</button>`;
  const sess=S;requestAnimationFrame(()=>{if(S===sess&&$('#sx').classList.contains('open'))fb.classList.add('show')});
  hideFoot();
  $('#fbPlay').onclick=()=>speak(sayOf(it));
  $('#fbNext').onclick=nextTask;
  if(DB.settings.autoplay&&!['listen','kanaListen','dictation'].includes(S.cur.type))speak(sayOf(it));

function selfGrade(it){
  if(S.answered)return;
  const fb=$('#fb');fb.className='fb ok';
  $('#fbInner').innerHTML=`<h3 style="color:var(--ink)">정답과 비교해 보세요</h3>${answerBlock(it)}
    <div class="grades"><button class="g-again" data-g="again">다시<small>틀렸어요</small></button><button class="g-hard" data-g="hard">애매<small>겨우 떠올림</small></button><button class="g-good" data-g="good">정확<small>바로 말했어요</small></button><button class="g-easy" data-g="easy">쉬움<small>너무 쉬워요</small></button></div>`;
  const sess=S;requestAnimationFrame(()=>{if(S===sess&&$('#sx').classList.contains('open'))fb.classList.add('show')});
  $('#fbPlay').onclick=()=>speak(sayOf(it));
  speak(sayOf(it));
  document.querySelectorAll('#fbInner [data-g]').forEach(b=>b.onclick=()=>{
    const g=b.dataset.g;submit(g!=='again',g);
  });
}
function hideFeedback(){$('#fb').classList.remove('show')}
function nextTask(){
  hideFeedback();stopSpeech();sayEpoch++;
  S.idx++;
  if(S.idx>=S.queue.length)return finishSession();
  renderTask();
}
function finishSession(){
  $('#sxProg').style.width='100%';
  const acc=S.answers?Math.round(S.correct/S.answers*100):100;
  const mins=Math.max(1,Math.round((Date.now()-S.start)/60000));
  const wrong=[...new Map(S.wrong.map(x=>[x.id,x])).values()];
  const em=acc>=95?'🏆':acc>=80?'🎉':acc>=60?'💪':'🌱';
  $('#sxBody').innerHTML=`<div class="done-wrap"><div class="big">${em}</div><h2>${S.title} 완료!</h2><p>${acc>=80?'훌륭해요. 기억은 반복할수록 오래갑니다.':'틀린 항목은 곧 다시 복습하게 돼요. 꾸준함이 실력입니다.'}</p>
    <div class="kpis" style="margin-bottom:16px"><div class="kpi"><b>${S.answers}</b><span>푼 문제</span></div><div class="kpi"><b>${acc}%</b><span>정답률</span></div><div class="kpi"><b>${S.newCount}</b><span>새로 배움</span></div></div>
    ${wrong.length?`<div class="card" style="text-align:left;padding:8px 16px"><div class="group-t" style="margin-top:8px">다시 볼 항목 · 누르면 발음</div><ul class="wl">${wrong.map(it=>`<li data-id="${it.id}"><div class="m"><div class="jp">${itemJP(it)}</div><div class="ko">${itemKO(it)}</div></div><span>🔊</span></li>`).join('')}</ul></div>`:''}
    <p style="font-size:12px;color:var(--muted);margin-top:14px">학습 시간 약 ${mins}분 · 연속 ${streak()}일째</p></div>`;
  document.querySelectorAll('#sxBody [data-id]').forEach(li=>li.onclick=()=>speak(sayOf(BY_ID[li.dataset.id])));
  primary('완료',closeSession);
}
function closeSession(){
  stopSpeech();sayEpoch++;hideFeedback();$('#sx').classList.remove('open');S=null;
  if(LS&&$('#ls').classList.contains('open'))drawLesson();
  render();
}
$('#sxClose').onclick=()=>{
  if(S&&S.idx<S.queue.length&&S.answers>0&&!confirm('학습을 그만둘까요? 지금까지의 기록은 저장돼요.'))return;
  closeSession();
};

/* ============================================================
   12. 내장 상황 회화 — 정해진 예문으로 연습, AI/문법 채점 아님
